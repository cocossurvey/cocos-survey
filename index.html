<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#F6F8F7;--ink:#182422;--mute:#5E6F6D;--rule:#D5DEDC;--acc:#0E6C72;--acc-soft:#E3F0F0;--card:#fff;
 --new:#E4E9E8;--visited:#F6D77A;--done:#8FD19E;--closed:#9AA5A3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:19px;line-height:1.45}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--card);font-size:14px;color:var(--mute)}
header b{color:var(--ink)}
header a{color:var(--acc);text-decoration:none;margin-left:10px}
main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
.q{margin:0 0 26px}
.qt{font-weight:600;margin:0 0 10px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:6px 0;border:1px solid var(--rule);border-radius:10px;background:var(--card);cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);flex:none}
.opt.multi .dot{border-radius:5px}
.opt.sel .dot{background:var(--acc);border-color:var(--acc)}
.opt input[type=text]{margin-left:auto;font-size:17px;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;width:45%}
input.te,textarea.te,select.te{width:100%;font-size:18px;padding:10px;border:1px solid var(--rule);border-radius:8px;background:var(--card)}
textarea.te{min-height:110px}
table.mx{width:100%;border-collapse:collapse;font-size:16px}
table.mx th,table.mx td{border:1px solid var(--rule);padding:8px 6px;text-align:center;vertical-align:middle;min-width:46px;height:48px}
table.mx th{font-size:14px}
table.mx td.rowlab{text-align:left;font-weight:600;width:30%}
table.mx td.cell{cursor:pointer}
table.mx td.cell.sel{background:var(--acc);color:#fff}
.tblwrap{overflow-x:auto}
table.cj{width:100%;border-collapse:collapse;font-size:16px;margin-bottom:18px}
table.cj th,table.cj td{border:1px solid #999;padding:8px;vertical-align:top;text-align:left}
table.cj th{background:#dde5f0}
table.cj td.lab{background:#f2f2f2;font-weight:600;width:32%}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--card);border-top:1px solid var(--rule)}
button{font-size:18px;padding:12px 22px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:var(--card);color:var(--acc)}
button.warn{background:var(--card);color:#B05A2A;border-color:#B05A2A}
button.big{width:100%;padding:18px;font-size:20px;margin-top:10px}
button:disabled{opacity:.4}
.info{color:var(--mute);font-size:15px}
.admin{padding:20px 16px;max-width:820px;margin:0 auto}
.admin pre{background:var(--card);border:1px solid var(--rule);padding:10px;overflow:auto;max-height:240px;font-size:12px}
.end{text-align:center;padding:60px 20px}
h3.blk{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);margin:0 0 18px}
.asknote{margin:-4px 0 10px;font-size:0.9em;color:#555}
.asknote summary{cursor:pointer;color:var(--acc)}
/* household grid */
.hdrow{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;margin:0 0 14px;font-size:15px}
.legend span{display:inline-flex;align-items:center;gap:6px;margin-right:14px}
.legend i{display:inline-block;width:16px;height:16px;border-radius:4px;border:1px solid #889}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:8px 0 22px}
.tile{position:relative;height:60px;border-radius:9px;border:1px solid #9aa;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;cursor:pointer;background:var(--new);-webkit-tap-highlight-color:transparent}
.tile.visited{background:var(--visited)}
.tile.done{background:var(--done)}
.tile.closed{background:var(--closed);color:#fff}
.tile.closed::after{content:"×";position:absolute;right:5px;top:1px;font-size:13px}
.tile small{position:absolute;left:5px;bottom:2px;font-size:11px;font-weight:400;color:#334}
.tile.add{background:var(--card);border-style:dashed;color:var(--acc);font-size:15px}
.sub{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);margin:18px 0 6px}
.card h2{margin:0 0 4px}
.card .row{display:flex;gap:12px;flex-wrap:wrap;margin:8px 0}
.card .row label{flex:1;min-width:140px;font-size:15px;color:var(--mute)}
.card .row input,.card .row select{display:block;width:100%;margin-top:4px}
.seg{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}
.seg button{font-size:16px;padding:10px 14px;background:var(--card);color:var(--acc)}
.seg button.on{background:var(--acc);color:#fff}
.visits{border:1px solid var(--rule);border-radius:10px;background:var(--card);padding:8px 12px;margin:8px 0}
.visits div{padding:6px 0;border-bottom:1px solid var(--rule);font-size:16px}
.visits div:last-child{border-bottom:none}
.rule{background:var(--acc-soft);border-radius:10px;padding:10px 14px;font-size:15px;margin:12px 0}
.counts{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;margin:6px 0 10px}
.counts b{font-size:19px}
.langtag{font-size:13px;border:1px solid var(--acc);color:var(--acc);border-radius:6px;padding:2px 6px;cursor:pointer}
/* home screen */
.home{max-width:560px;margin:30px auto 0;display:flex;flex-direction:column;gap:16px}
.homebtn{display:flex;flex-direction:column;align-items:flex-start;gap:4px;width:100%;text-align:left;padding:22px 24px;border-radius:14px}
.homebtn .hb-title{font-size:24px;font-weight:700}
.homebtn .hb-sub{font-size:15px;font-weight:400;opacity:.85}
.homebtn.sec .hb-sub{color:var(--mute)}
.admin .homebtn{margin:10px 0}

</style></head><body>

<script>
const SPEC = {"blocks": [{"name": "Interviewer", "randomizer": null, "pages": [[{"tag": "interviewer", "type": "MC", "text": "Interviewer: who is administering this survey?", "choices": ["Susan Carland", "Lachlan McNamee", "Osman McCrae", "Self-completed by respondent"]}, {"tag": "survey_date", "type": "TE", "text": "Interviewer: date of this interview (day/month/year, e.g. 23/09/2026)"}, {"tag": "house_no", "type": "TE", "text": "Interviewer: house number (from the household list; E1, E2, ... for a dwelling without a number)"}, {"tag": "hh_adult_men", "type": "TEN", "text": "Interviewer: number of adult men (18 or over) who normally live in this house"}, {"tag": "hh_adult_women", "type": "TEN", "text": "Interviewer: number of adult women (18 or over) who normally live in this house"}, {"tag": "birthday_rank", "type": "MC", "text": "Interviewer: which person on the birthday list is being interviewed?", "choices": ["1 (most recent birthday)", "2 (next most recent)", "3", "4 or later", "Rule could not be applied (say why in the notes)"]}]]}, {"name": "Introduction and consent", "randomizer": null, "pages": [[{"tag": "intro", "type": "DB", "text": "<h3>Cocos (Keeling) Islands community survey</h3><p>Thank you for taking part. This survey is run by researchers from Monash University (Dr Susan Carland and Dr Lachlan McNamee). It asks about life on Cocos, your household, your views on climate change and the proposed relocation of the community, and how you feel about governments in the region. There are no right or wrong answers, and you can skip any question you do not want to answer.</p><p>Your own answers are private. Nobody outside the research team will ever see what you personally said, and no one will be named. We will only share the overall picture: for example, how many people on Cocos agree or disagree with something, added up from everyone's answers.</p>"}], [{"tag": "consent", "type": "MC", "text": "Do you agree to take part in this survey?", "choices": ["Yes, I agree to take part", "No, I do not want to take part"]}], [{"tag": "language", "type": "MC", "text": "Would you like to take this survey in English or Cocos Malay?", "choices": ["English", "Cocos Malay"]}]]}, {"name": "About you and your household", "randomizer": null, "pages": [[{"tag": "island", "type": "MC", "text": "Where do you live?", "choices": ["Home Island", "West Island", "Elsewhere (please say where)"], "other": 3}, {"tag": "cocos_malay", "type": "MC", "text": "Are you Cocos Malay?", "choices": ["Yes", "No"]}], [{"tag": "culture_preserve", "type": "MC", "text": "How important is it to you that Cocos Malay culture and traditions are preserved for future generations?", "choices": ["Very important", "Quite important", "Not very important", "Not at all important"], "display_if": ["cocos_malay", 1]}, {"tag": "culture_confident", "type": "MC", "text": "How confident are you that Cocos Malay cultural practices will be maintained by future generations?", "choices": ["Very confident", "Somewhat confident", "Not very confident", "Not at all confident"], "display_if": ["cocos_malay", 1]}, {"tag": "indig_self", "type": "MC", "text": "Do you consider yourself Indigenous to the Cocos (Keeling) Islands?", "choices": ["Yes", "No", "Not sure"], "display_if": ["cocos_malay", 1], "ask_note": "Also called orang asli. There is no single definition. The United Nations describes Indigenous peoples as people who see themselves as a distinct people; who have a long connection to a particular land; and who have their own language, culture and way of life that they want to keep and pass on to their children. Whether Cocos Malays are Indigenous, like Aboriginal and Torres Strait Islander people in other parts of Australia, is for you to say."}], [{"tag": "indig_recog", "type": "MC", "text": "How important is it to you that the Australian Government officially recognises Cocos Malays as the Indigenous people of the Cocos (Keeling) Islands?", "choices": ["Very important", "Quite important", "Not very important", "Not at all important"], "display_if": ["cocos_malay", 1]}, {"tag": "indig_people", "type": "MC", "text": "Do you agree or disagree: the Cocos Malay people, with their own language and customs, came into being here on these islands and exist nowhere else.", "choices": ["Strongly agree", "Agree", "Disagree", "Strongly disagree"], "display_if": ["cocos_malay", 1]}, {"tag": "indig_leave", "type": "MC", "text": "If the Cocos Malay community had to leave these islands, what do you think would happen to it?", "choices": ["It would carry on as a people somewhere else", "It would change a great deal", "It would come to an end as a people"], "display_if": ["cocos_malay", 1]}], [{"tag": "indig_land", "type": "MC", "text": "Do you agree or disagree: because our ancestors lived and are buried here, these islands are the homeland of the Cocos Malay people.", "choices": ["Strongly agree", "Agree", "Disagree", "Strongly disagree"], "display_if": ["cocos_malay", 1]}, {"tag": "religion", "type": "MC", "text": "What is your religion?", "choices": ["Islam", "Christianity", "No religion", "Other"], "other": 4}], [{"tag": "religiosity", "type": "MATRIX", "text": "How practising of your religion would you describe yourself, on a scale from 0 to 5, where 0 means not practising and 5 means very practising?", "rows": ["How practising you are"], "cols": ["0<br>Not practising", "1", "2", "3", "4", "5<br>Very practising"], "display_if_not": ["religion", 3]}], [{"tag": "islam_change", "type": "MC", "text": "Thinking about the last 40 years, how much has the way Cocos Malays practise Islam changed?", "choices": ["A great deal", "Somewhat", "Not much", "Not at all"], "display_if_all": [["cocos_malay", 1], ["religion", 1]]}], [{"tag": "islam_change_eval", "type": "MC", "text": "Overall, do you think these changes have been a good thing or a bad thing?", "choices": ["A very good thing", "A somewhat good thing", "A somewhat bad thing", "A very bad thing"], "display_if_in": ["islam_change", [1, 2]]}, {"tag": "born_cocos", "type": "MC", "text": "Were you born on the Cocos (Keeling) Islands?", "choices": ["Yes", "No, born elsewhere in Australia", "No, born in another country"]}, {"tag": "years_cocos", "type": "TEN", "text": "How many years in total have you lived on Cocos?"}], [{"tag": "age", "type": "TEN", "text": "How old are you?"}, {"tag": "gender", "type": "MC", "text": "What is your gender?", "choices": ["Man", "Woman", "Prefer to self-describe", "Prefer not to say"], "other": 3}, {"tag": "hh_size", "type": "TEN", "text": "How many people live in your household? (Household means you, your spouse, any children under 21, and any grandparents or in-laws who live with you.)"}], [{"tag": "hh_relation", "type": "MC", "text": "What is your relationship to the head of your household?", "choices": ["Self", "Spouse", "Child", "Parent", "Other"]}, {"tag": "education", "type": "MC", "text": "What is the highest level of education you have completed?", "choices": ["None", "Primary", "Secondary (Year 10)", "Secondary (Year 12)", "TAFE / trade certificate", "University", "Other"]}, {"tag": "marital", "type": "MC", "text": "What is your marital status?", "choices": ["Single", "Married", "Widowed", "Divorced / separated"]}], [{"tag": "lang_home", "type": "MA", "text": "Which languages do you speak at home? (tick all that apply)", "choices": ["Cocos Malay", "English", "Standard Malay / Bahasa", "Other"], "other": 4}, {"tag": "speak_english", "type": "MC", "text": "How well do you speak English?", "choices": ["Not at all", "Not well (a few words or phrases)", "Moderately well (can hold a basic conversation)", "Very well"]}, {"tag": "read_english", "type": "MC", "text": "How well do you read English?", "choices": ["Not at all", "Not well (a few words or phrases)", "Moderately well (can read basic text)", "Very well"]}]]}, {"name": "Work, income and family connections", "randomizer": null, "pages": [[{"tag": "working", "type": "MC", "text": "Are you currently working?", "choices": ["Yes, permanent", "Yes, contract / casual", "No"]}, {"tag": "sector", "type": "MC", "text": "What is your main type of work?", "choices": ["Shire / local government", "Education (school)", "Health (clinic, nursing)", "Other government services (e.g. Administrator's office, police, customs)", "Cocos Co-operative", "Tourism / hospitality", "Fishing", "Retail", "Construction and maintenance", "Transport, airport or port", "Defence-related work", "Care work", "Other"], "other": 13}, {"tag": "family_mainland", "type": "MA", "text": "Do you have close family (parents, children, siblings) living away from Cocos? (tick all that apply)", "choices": ["Yes, in Perth", "Yes, elsewhere in Western Australia", "Yes, elsewhere in Australia", "Yes, on Christmas Island", "Yes, in Malaysia", "Yes, somewhere else", "No"]}], [{"tag": "centrelink", "type": "MC", "text": "Do you or anyone in your household receive a Centrelink payment? (Household means you, your spouse, any children under 21, and any grandparents or in-laws who live with you.)", "choices": ["Yes", "No", "Prefer not to say"]}], [{"tag": "centrelink_type", "type": "MA", "text": "Which payment(s)? (tick all that apply)", "choices": ["Age Pension", "JobSeeker", "Disability Support Pension", "Parenting Payment", "Family Tax Benefit", "Carer Payment", "Other"], "other": 7, "display_if": ["centrelink", 1]}, {"tag": "get_by", "type": "MC", "text": "Thinking about all the money coming into your household, is it enough for you to get by?", "choices": ["Yes, easily", "Yes, just enough", "Not really", "Not at all"]}]]}, {"name": "Moving and mobility", "randomizer": null, "pages": [[{"tag": "time_6m", "type": "MC", "text": "Over the past six months, where have you spent most of your time?", "choices": ["All or almost all of my time on Cocos", "More time on Cocos than on the mainland", "About equal time on Cocos and the mainland", "More time on the mainland than on Cocos", "All or almost all of my time on the mainland", "Mostly in another country"]}, {"tag": "hh_moved_5y", "type": "MC", "text": "In the past five years, has anyone from your household moved away from Cocos to live somewhere else? (Household means you, your spouse, any children under 21, and any grandparents or in-laws who live with you.)", "choices": ["Yes", "No"]}, {"tag": "hope_10y", "type": "MC", "text": "Where do you hope your household will be living in 10 years from now, that is around 2036?", "choices": ["Home Island", "West Island", "Perth", "Elsewhere in Western Australia", "Elsewhere in Australia", "Christmas Island", "Malaysia", "Other"], "other": 8}, {"tag": "return_cocos", "type": "MC", "text": "If your household did move away from Cocos, do you think you would come back to live here one day?", "choices": ["Yes, definitely", "Probably", "Probably not", "No", "Not sure"], "display_if_in": ["hope_10y", [3, 4, 5, 6, 7, 8]]}], [{"tag": "migr_factors", "type": "MA", "text": "What factors would influence your household's decision to move somewhere else from where you are today? (tick all that apply)", "choices": ["Sea-level rise / flooding / erosion", "Economic opportunity", "Education for children", "Health care", "Family reunion", "Cost of living on Cocos", "Other"], "other": 7}, {"tag": "migr_confidence", "type": "MC", "text": "If your household wanted to move away from Cocos, how confident are you that you could do so? (Household means you, your spouse, any children under 21, and any grandparents or in-laws who live with you.)", "choices": ["Very confident", "Somewhat confident", "Not confident", "Not at all confident"]}], [{"tag": "finance_holdback", "type": "MC", "text": "Is your financial situation holding you back from leaving Cocos?", "choices": ["Yes, a lot", "Yes, somewhat", "No", "I do not want to leave anyway"]}, {"tag": "migr_obstacles", "type": "MA", "text": "What obstacles might prevent your household from moving if you wanted to? (tick all that apply)", "choices": ["Lack of money", "Family obligations", "Attachment to Cocos", "No job on the mainland", "Housing costs on the mainland", "Language", "Other"], "other": 7}]]}, {"name": "Climate change and adaptation", "randomizer": null, "pages": [[{"tag": "cc_belief", "type": "MC", "text": "Do you believe that climate change is happening?", "choices": ["Yes, definitely", "Yes, probably", "No, probably not", "No, definitely not"]}, {"tag": "cc_serious", "type": "MC", "text": "Do you think that climate change is a very serious problem, somewhat serious, not very serious, or not a problem at all for you?", "choices": ["Very serious problem", "Somewhat serious", "Not very serious", "Not a problem at all"]}, {"tag": "cc_meetings", "type": "MC", "text": "How often have you participated in any community meetings or initiatives to address climate change in the past 12 months?", "choices": ["Regularly", "Occasionally", "Rarely", "Never"]}], [{"tag": "cc_discuss", "type": "MC", "text": "How often have you discussed climate change with friends and family members in the past 12 months?", "choices": ["Regularly", "Occasionally", "Rarely", "Never"]}, {"tag": "cc_priority", "type": "MC", "text": "If you had to choose, what should be the top priority for the Australian Government in addressing climate change on Cocos?", "choices": ["Protecting Cocos from climate change (e.g. seawalls, raising land, protecting fresh water)", "Reducing pollution and emissions worldwide", "Supporting Cocos residents to relocate to the mainland"]}, {"tag": "cc_efficacy", "type": "MC", "text": "Do you believe there is nothing you can do personally to reduce the impact of climate change?", "choices": ["Yes", "No"]}], [{"tag": "cc_events", "type": "MA", "text": "In the past 12 months, has your household experienced any of the following? (tick all that apply) (Household means you, your spouse, any children under 21, and any grandparents or in-laws who live with you.)", "choices": ["Flooding of your home or yard (from the sea, rain or ground water)", "Storm surge or big swell damage", "Erosion of land near your home", "Salt water getting into wells or gardens", "Shortage of fresh water", "Cyclone or severe storm damage", "Unusual heat", "None of these"]}, {"tag": "cc_flood_freq", "type": "MC", "text": "How often does water flood the land around your home?", "choices": ["Never", "Once a year or less", "A few times a year", "Most months", "Most weeks"]}, {"tag": "cc_access", "type": "MA", "text": "In the past 12 months, have weather conditions affected your household's ability to access any of the following? (tick all that apply)", "choices": ["Fresh water", "Food", "The health clinic", "Schooling", "Flights or the ferry", "Work", "None of the above"]}], [{"tag": "cc_adapt", "type": "MA", "text": "Has your household taken any steps to adapt or prepare for rising sea levels in the past 12 months? (tick all that apply)", "choices": ["Built or strengthened a seawall", "Installed a water tank", "Raised the floor of the house", "Moved to higher ground", "Planted trees or vegetation to hold the shoreline", "Other", "None"], "other": 6}, {"tag": "cc_safer", "type": "MC", "text": "If your household wanted to make your home safer from flooding, do you think you would be able to do so?", "choices": ["Yes, easily", "Yes, but it would be hard", "No, probably not", "Definitely not"]}]]}, {"name": "The proposed relocation", "randomizer": null, "pages": [[{"tag": "reloc_intro", "type": "DB", "text": "<p>The next questions are about the Australian Government's proposal, sometimes called a \"managed retreat\", to move the Cocos community away from the islands over coming decades because of rising seas. This was one idea among several that the Government has put forward. It has not said that it will definitely go ahead with it.</p>"}, {"tag": "reloc_heard", "type": "MC", "text": "Before today, how much had you heard about this proposal?", "choices": ["A lot", "Some", "A little", "Nothing at all"]}, {"tag": "reloc_source", "type": "MA", "text": "Where have you heard about it? (tick all that apply)", "choices": ["Shire of Cocos (Keeling) Islands", "The Administrator or Australian Government officials", "Community or mosque meetings", "Family and friends", "News media (TV, radio, newspapers)", "Social media", "Other", "I have not heard about it"], "other": 7}], [{"tag": "uninhabitable", "type": "MC", "text": "Do you agree or disagree: Cocos will become uninhabitable because of rising sea levels this century?", "choices": ["Strongly agree", "Agree", "Disagree", "Strongly disagree"]}, {"tag": "reloc_likely", "type": "MC", "text": "How likely do you think it is that the community will actually be required by the Government to leave Cocos?", "choices": ["Very likely", "Somewhat likely", "Not very likely", "Not at all likely"]}, {"tag": "reloc_when", "type": "MC", "text": "If it does happen, when do you expect the community would be required to leave?", "choices": ["Within the next 5 years", "In 5 to 10 years", "In 10 to 20 years", "More than 20 years from now", "Don't think it will happen"]}], [{"tag": "reloc_support", "type": "MC", "text": "Overall, do you support or oppose the proposal to relocate the Cocos community?", "choices": ["Strongly support", "Somewhat support", "Neither support nor oppose", "Somewhat oppose", "Strongly oppose"]}, {"tag": "reloc_reason", "type": "MC", "text": "In your view, what is the main reason the Australian Government wants to relocate the community?", "choices": ["Rising seas and climate change", "Defence and the airstrip", "The cost of providing services to Cocos", "Something else"], "other": 4}, {"tag": "excuse_direct", "type": "MC", "text": "Do you agree with this statement: the Government is using climate change as an excuse to move the community off Cocos?", "choices": ["Yes, I agree", "No, I do not agree"]}], [{"tag": "gov_airstrip", "type": "MC", "text": "Do you agree or disagree: the Australian Government cares more about keeping the airstrip on Cocos than about keeping a community living here?", "choices": ["Strongly agree", "Agree", "Disagree", "Strongly disagree"]}, {"tag": "gov_wants_out", "type": "MC", "text": "Do you agree or disagree: in the end, the Australian Government wants to move people off Cocos?", "choices": ["Strongly agree", "Agree", "Disagree", "Strongly disagree"]}, {"tag": "promise_1984", "type": "MC", "text": "When Cocos joined Australia in 1984, the Government promised the Cocos Malay people that their culture, customs and religion would be protected, and that they would have the same rights and services as other Australians. How far has the Government kept those promises?", "choices": ["Completely", "Mostly", "Partly", "Only a little", "Not at all", "I don't know enough about the promises to say"], "display_if": ["cocos_malay", 1], "ask_note": "In 1984 the people of Cocos voted to become part of Australia. Before that vote, and at the United Nations afterwards, the Australian Government gave undertakings to the Cocos Malay community: that the land on Home Island, bought from the Clunies-Ross family in 1978, would be held for the benefit of the Cocos Malay people; that the community's religious beliefs, culture, customs and traditions would be preserved and protected; that Cocos Malays would have the same rights, responsibilities and standard of services as other Australians; and that the community would have an elected council with a real say in local affairs. A further memorandum of understanding was signed with Prime Minister Hawke in 1991."}, {"tag": "promise_move", "type": "MC", "text": "Some people say that if the Government moved the Cocos Malay community off Home Island because of rising seas, that would break the promises made in 1984. Other people say the Government could keep those promises by protecting the community and its culture in a new place. Which is closer to your view?", "choices": ["Moving the community off Cocos would break the promises made in 1984", "The 1984 promises could be kept if the community and its culture were protected in a new place", "Not sure"], "display_if": ["cocos_malay", 1]}, {"tag": "reloc_say", "type": "MC", "text": "How much say should the Cocos community have over whether and how relocation happens?", "choices": ["The community should have the final say", "The community and the Government should decide together", "The community should be consulted, but the Government decides"]}], [{"tag": "trust", "type": "MATRIX", "text": "How much do you trust each of the following to act in the best interests of the Cocos community?", "rows": ["The Australian Government", "The Administrator of the Indian Ocean Territories", "The Shire of Cocos (Keeling) Islands", "Community and religious leaders on Cocos"], "cols": ["A great deal", "Somewhat", "Not very much", "Not at all"]}], [{"tag": "reloc_self", "type": "MC", "text": "If the Government required your household to leave Cocos, what do you think you would do?", "choices": ["Move willingly", "Move, but reluctantly", "Try to stay for as long as possible", "Refuse to leave"]}, {"tag": "reloc_dest", "type": "MC", "text": "If you had to leave Cocos, where would you go?", "choices": ["Perth", "Elsewhere in Australia", "Christmas Island", "Malaysia", "Somewhere else"], "other": 5}, {"tag": "voice", "type": "MA", "text": "In the past 12 months, have you done any of the following about the relocation proposal? (tick all that apply)", "choices": ["Attended a community meeting", "Signed a petition", "Contacted a Shire councillor, the Administrator or a federal MP", "Posted about it on social media", "Spoken to a journalist", "Taken part in a protest or demonstration", "None of these"]}], [{"tag": "fair_treat", "type": "MC", "text": "Do you agree or disagree: the Australian Government treats Cocos residents the same as other Australians?", "choices": ["Strongly agree", "Agree", "Disagree", "Strongly disagree"]}, {"tag": "status_future", "type": "MC", "text": "Thinking about the long run, what should Cocos' relationship with Australia be?", "choices": ["Stay as it is now", "More self-government for Cocos within Australia", "Independence"]}]]}, {"name": "Government and the region", "randomizer": null, "pages": [[{"tag": "gov_sat_cocos", "type": "MC", "text": "How satisfied are you with the way Cocos is being governed today?", "choices": ["Very satisfied", "Somewhat satisfied", "Not very satisfied", "Not at all satisfied"]}]]}, {"name": "Identity and culture", "randomizer": null, "pages": [[{"tag": "home", "type": "MC", "text": "How strongly do you feel that Cocos is your home?", "choices": ["Very strongly", "Somewhat", "Not very strongly", "Not at all"]}]]}, {"name": "Relocation packages (conjoint)", "randomizer": null, "pages": [[{"tag": "cj_intro", "type": "DB", "text": "<h3>Imagining a relocation deal</h3>\n<p>Now I want you to imagine something that is <strong>not real</strong>. Imagine the Government decided that everyone on Cocos had to leave, and offered the community a deal. There is no such decision as far as we know. We just want to understand what would matter to people if it ever happened.</p>\n<p>I will describe <strong>five pairs</strong> of deals. For each pair, tell me which of the two you would prefer. Then I will ask whether you would actually take the deal you chose.</p>\n<p>The deals are made up at random, so some may seem unlikely. There are no right or wrong answers.</p>", "js": "conjoint"}], [{"tag": "cj1_table", "type": "DB", "text": "<p><strong>Pair 1 of 5.</strong> Imagine everyone had to leave Cocos and the Government offered these two deals.</p><table style=\"border-collapse:collapse;width:100%;font-size:1em\"><tr><th style=\"border:1px solid #999;padding:6px\"></th><th style=\"border:1px solid #999;padding:6px;background:#dde5f0\">Deal A</th><th style=\"border:1px solid #999;padding:6px;background:#dde5f0\">Deal B</th></tr><tr><td style=\"border:1px solid #999;padding:6px;background:#f2f2f2;font-wei , "migr_factors": {"text": "Q37", "choices": "Q37 answers"}, "migr_confidence": {"text": "Q38", "choices": "Q38 answers"}, "finance_holdback": {"text": "Q39", "choices": "Q39 answers"}, "migr_obstacles": {"text": "Q40", "choices": "Q40 answers"}, "cc_belief": {"text": "Q41", "choices": "Q41 answers"}, "cc_serious": {"text": "Q42", "choices": "Q42 answers"}, "cc_meetings": {"text": "Q43", "choices": "Q43 answers"}, "cc_discuss": {"text": "Q44", "choices": "Q44 answers"}, "cc_priority": {"text": "Q45", "choices": "Q45 answers"}, "cc_efficacy": {"text": "Q46", "choices": "Q46 answers"}, "cc_events": {"text": "Q47", "choices": "Q47 answers"}, "cc_flood_freq": {"text": "Q48", "choices": "Q48 answers"}, "cc_access": {"text": "Q49", "choices": "Q49 answers"}, "cc_adapt": {"text": "Q50", "choices": "Q50 answers"}, "cc_safer": {"text": "Q51", "choices": "Q51 answers"}, "reloc_intro": {"text": "T2"}, "reloc_heard": {"text": "Q52", "choices": "Q52 answers"}, "reloc_source": {"text": "Q53", "choices": "Q53 answers"}, "uninhabitable": {"text": "Q54", "choices": "S2"}, "reloc_likely": {"text": "Q55", "choices": "Q55 answers"}, "reloc_when": {"text": "Q56", "choices": "Q56 answers"}, "reloc_support": {"text": "Q57", "choices": "Q57 answers"}, "reloc_reason": {"text": "Q58", "choices": "Q58 answers"}, "excuse_direct": {"text": "Q59", "choices": "Q59 answers"}, "gov_airstrip": {"text": "Q60", "choices": "S2"}, "gov_wants_out": {"text": "Q61", "choices": "S2"}, "promise_1984": {"text": "Q62", "ask_note": "Q62 note", "choices": "Q62 answers"}, "promise_move": {"text": "Q63", "choices": "Q63 answers"}, "reloc_say": {"text": "Q64", "choices": "Q64 answers"}, "trust": {"text": "Q65", "rows": "Q65 rows", "cols": "Q65 scale"}, "reloc_self": {"text": "Q66", "choices": "Q66 answers"}, "reloc_dest": {"text": "Q67", "choices": "Q67 answers"}, "voice": {"text": "Q68", "choices": "Q68 answers"}, "fair_treat": {"text": "Q69", "choices": "S2"}, "status_future": {"text": "Q70", "choices": "Q70 answers"}, "gov_sat_cocos": {"text": "Q71", "choices": "S3"}, "home": {"text": "Q72", "choices": "Q72 answers"}, "cj_intro": {"text": "T3"}, "cj1_choice": {"text": "Q73", "choices": "Q73 answers"}, "cj1_accept": {"text": "Q74", "choices": "Q74 answers"}, "research_reason": {"text": "Q75", "choices": "Q75 answers"}, "fb_missing": {"text": "Q76"}, "assist": {"text": "Q77", "choices": "Q77 answers"}, "close": {"text": "T4"}, "cj2_choice": {"text": "Q73", "choices": "Q73 answers"}, "cj2_accept": {"text": "Q74", "choices": "Q74 answers"}, "cj3_choice": {"text": "Q73", "choices": "Q73 answers"}, "cj3_accept": {"text": "Q74", "choices": "Q74 answers"}, "cj4_choice": {"text": "Q73", "choices": "Q73 answers"}, "cj4_accept": {"text": "Q74", "choices": "Q74 answers"}, "cj5_choice": {"text": "Q73", "choices": "Q73 answers"}, "cj5_accept": {"text": "Q74", "choices": "Q74 answers"}};
// Cocos community survey: offline app with household module. Source of truth lives in app/; build.py inlines into index.html.
const KEY_RESP = "cocos_responses_v1", KEY_CUR = "cocos_current_v1", KEY_HH = "cocos_households_v1", KEY_SET = "cocos_settings_v1";
const HOUSES_MAIN = Array.from({length:97},(_,i)=>String(i+1));
const HOUSES_SPECIAL = Array.from({length:10},(_,i)=>String(i+98));
const OUTCOMES = {NC:"Nobody home", A:"Appointment made", R:"Refused (this person)", RA:"Everyone refused", V:"Vacant / nobody lives here", NR:"Not a house (shop, office, other)", I:"Interview done", P:"Interview ended early", O:"Other (see note)"};
let S = null;          // current interview session
let VIEW = {screen:"home", house:null};  // home | grid | house | admin

// ---------------- storage
function loadResponses(){ try{return JSON.parse(localStorage.getItem(KEY_RESP)||"[]")}catch(e){return []} }
function saveResponses(r){ localStorage.setItem(KEY_RESP, JSON.stringify(r)) }
function saveCur(){ localStorage.setItem(KEY_CUR, JSON.stringify(S)) }
function loadHH(){ try{return JSON.parse(localStorage.getItem(KEY_HH)||'{"houses":{},"extras":[]}')}catch(e){return {houses:{},extras:[]}} }
function saveHH(h){ localStorage.setItem(KEY_HH, JSON.stringify(h)) }
function settings(){ try{return JSON.parse(localStorage.getItem(KEY_SET)||"{}")}catch(e){return {}} }
function setSetting(k,v){ const s=settings(); s[k]=v; localStorage.setItem(KEY_SET, JSON.stringify(s)) }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8) }
function touch(rec){ rec.updated=new Date().toISOString(); return rec; }
function deviceId(){ let d=settings().device; if(!d){ d="dev-"+uid(); setSetting("device", d); } return d; }
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0") }
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}

// ---------------- language
function lang(){ return (S && S.lang) || settings().lang || "en"; }
function tr(id, fallback){ if(lang()==="en" || !id) return fallback; const v=MS[id]; return (v && v.trim()) ? v : fallback; }
function trList(id, list){ if(lang()==="en" || !id) return list; const v=MS[id]; if(!v || !v.trim()) return list; const lines=v.split("\n").map(x=>x.trim()).filter(Boolean); return lines.length===list.length ? lines : list; }
function itemText(it){ const k=I18N[it.tag]||{}; return tr(k.text, it.text); }
function itemChoices(it){ const k=I18N[it.tag]||{}; return trList(k.choices, it.choices); }
function toggleLang(){ const l = lang()==="en" ? "ms" : "en"; if(S){ S.lang=l; saveCur(); } else setSetting("lang", l); render(); }

// ---------------- household status
function houseRec(h,id){ if(!h.houses[id]) h.houses[id]={id, occupied:"", men:"", women:"", rank:"", knows:"", visits:[], responses:[], notes:""}; return h.houses[id]; }
function status(rec){
  if(!rec) return "new";
  if(rec.responses && rec.responses.length) return "done";
  if(rec.occupied==="V"||rec.occupied==="NR") return "closed";
  if(rec.visits.some(v=>v.outcome==="RA")) return "closed";
  if(rec.visits.length) return "visited";
  return "new";
}
function allHouseIds(h){ return HOUSES_MAIN.concat(HOUSES_SPECIAL, h.extras.map(e=>e.id)); }


// ---------------- home screen
function renderHome(main){
  document.getElementById("nav").style.display="none";
  const r=loadResponses().length; const hh=loadHH(); const done=Object.values(hh.houses).filter(x=>x.responses.length).length;
  let paused=null; try{ const c=localStorage.getItem(KEY_CUR); if(c) paused=JSON.parse(c); }catch(e){}
  main.innerHTML=`<div class="home">
    <button class="homebtn" id="goSurvey"><span class="hb-title">Survey</span><span class="hb-sub">House list, visits and interviews</span></button>
    <button class="homebtn sec" id="goData"><span class="hb-title">Data and settings</span><span class="hb-sub">Sync, send backup, files, passcode</span></button>
    ${paused?`<button class="homebtn warn" id="resume"><span class="hb-title">Resume the interview in progress</span><span class="hb-sub">${paused.house?"House "+esc(paused.house):"No house number"}, started ${esc(new Date(paused.started).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}))}</span></button>`:""}
    <p class="info" style="text-align:center;margin-top:26px"><b>${done}</b> houses done &middot; <b>${r}</b> interviews on this device${syncEnabled()?`<br><span id="syncLine">${esc(syncLineText())}</span>`:""}</p>
  </div>`;
  document.getElementById("goSurvey").onclick=()=>{ VIEW={screen:"grid"}; render(); };
  document.getElementById("goData").onclick=()=>{ VIEW={screen:"admin"}; render(); };
  if(paused) document.getElementById("resume").onclick=()=>{ S=paused; render(); };
  if(syncEnabled() && (!settings().lastSync || Date.now()-new Date(settings().lastSync).getTime()>120000)) syncNow("home");
}

    return `<div class="tile ${s}" data-house="${esc(id)}" title="${esc(ex?ex.desc:"")}">${esc(id)}${rec&&rec.visits.length&&s!=="done"?`<small>${rec.visits.length} visit${rec.visits.length>1?"s":""}</small>`:""}</div>`; };

  <div class="sub">Other dwellings (no house number)</div><div class="grid">${h.extras.map(e=>tile(e.id)).join("")}<div class="tile add" id="addExtra">+ add</div></div>

  if(!st.interviewer) setSetting("interviewer", SPEC.blocks[0].pages[0][0].choices[2]);
  main.querySelectorAll(".tile[data-house]").forEach(t=>t.onclick=()=>{ VIEW={screen:"house",house:t.dataset.house}; render(); });
  document.getElementById("addExtra").onclick=()=>{ const desc=prompt("Where is this dwelling? (lot number, street, or a short description)"); if(desc==null) return; const hh=loadHH(); const tag=deviceId().slice(-3); let n=1; while(hh.extras.some(e=>e.id==="E"+n+"."+tag)) n++; const id="E"+n+"."+tag; hh.extras.push({id, desc:desc.trim(), device:deviceId()}); touch(houseRec(hh,id)); saveHH(hh); scheduleSync(); VIEW={screen:"house",house:id}; render(); };
  document.getElementById("noHouse").onclick=()=>newSession(null);
}

  <div class="visits">${rec.visits.length?rec.visits.map((v,i)=>`<div>${esc(v.date)} &middot; <b>${esc(OUTCOMES[v.outcome]||v.outcome)}</b>${v.note?` &middot; ${esc(v.note)}`:""} <a href="#" data-del="${i}" style="float:right;color:#B05A2A;font-size:14px">remove</a></div>`).join(""):`<div class="info">No visits recorded yet.</div>`}</div>

  <p class="info" style="margin:4px 0">Which person on the birthday list is being interviewed?</p>

// ---------------- survey session
function buildPages(){
  const pages=[]; const randGroup = SPEC.blocks.filter(b=>b.randomizer);
  const pick = randGroup.length ? randGroup[Math.floor(Math.random()*randGroup.length)].name : null;
  for(const b of SPEC.blocks){ if(b.randomizer && b.name!==pick) continue; for(const p of b.pages) pages.push({block:b.name, items:p}); }
  return {pages, listArm: pick};
}
function newSession(houseId){
  const bp = buildPages(); const st=settings();
  S = {id: uid(), started: new Date().toISOString(), version: SPEC.version, listArm: bp.listArm, pages: bp.pages, idx: 0, ans: {}, cj: null, house: houseId||null, lang: st.lang||"en"};
  // interviewer page prefilled
  const ivChoices=SPEC.blocks[0].pages[0][0].choices; const k=ivChoices.indexOf(st.interviewer); if(k>=0) S.ans.interviewer=k+1;
  S.ans.survey_date=today().split("-").reverse().join("/");
  if(houseId){ const rec=loadHH().houses[houseId]||{}; S.ans.house_no=houseId; S.ans.hh_adult_men=rec.men; S.ans.hh_adult_women=rec.women;
    S.ans.birthday_rank={ "1":1,"2":2,"3":3,"4":4,"X":5 }[rec.rank]||""; S.idx=1; }  // skip the interviewer page
  saveCur(); render();
}
function drawConjoint(){
  const attrs = SPEC.attrs.slice(); const order = attrs.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]];}
  const cj = {attr_order: order.map(i=>attrs[i].key).join("|"), labels: order.map(i=>attrs[i].name), tasks: []};
  for(let t=0;t<SPEC.n_tasks;t++){ const task={A:[],B:[]};
    for(const p of ["A","B"]) for(const i of order){ const a=attrs[i]; task[p].push(a.levels[Math.floor(Math.random()*a.levels.length)]); }
    task.pick = Math.random()<0.5 ? "A" : "B"; cj.tasks.push(task); }
  return cj;
}
function visible(it){
  if(it.display_if){ const [t,c]=it.display_if; if(S.ans[t]!==c) return false; }
  if(it.display_if_not){ const [t,c]=it.display_if_not; if(S.ans[t]===c) return false; }
  if(it.display_if_all){ for(const [t,c] of it.display_if_all){ if(S.ans[t]!==c) return false; } }
  if(it.display_if_in){ const [t,cs]=it.display_if_in; if(!cs.includes(S.ans[t])) return false; }
  if(it.display_if_matrix_any){ const [t,rows,min]=it.display_if_matrix_any; const m=S.ans[t]||{}; if(!rows.some(r=>(m[r]||0)>=min)) return false; }
  return true;
}
// conjoint level text, translated when a Malay dictionary entry exists (C3..C5: "name\n• level\n• level")
function cjText(kind, idx, en){
  if(lang()==="en") return en;
  const id = kind==="label" ? "C"+(idx+3) : null;
  if(kind==="label"){ const v=MS[id]; return v&&v.trim()? v.split("\n")[0].trim() : en; }
  // level: find which attribute this level belongs to
  for(let a=0;a<SPEC.attrs.length;a++){ const li=SPEC.attrs[a].levels.indexOf(en); if(li>=0){ const v=MS["C"+(a+3)]; if(!v||!v.trim()) return en; const lines=v.split("\n").map(x=>x.replace(/^•\s*/,"").trim()).filter(Boolean); return lines[li+1]||en; } }
  return en;
}
function pipe(html){
  return html.replace(/\$\{e:\/\/Field\/([^}]+)\}/g,(m,f)=>{
    if(!S.cj) return "";
    let mm=f.match(/^r(\d)_label$/); if(mm){ const i=SPEC.attrs.findIndex(a=>a.name===S.cj.labels[+mm[1]-1]); return esc(cjText("label", i, S.cj.labels[+mm[1]-1])); }
    mm=f.match(/^t(\d)_([AB])_r(\d)$/); if(mm) return esc(cjText("level", 0, S.cj.tasks[+mm[1]-1][mm[2]][+mm[3]-1]));
    mm=f.match(/^t(\d)_pick$/); if(mm) return S.cj.tasks[+mm[1]-1].pick||"";
    return "";
  });
}
function cjTableText(html){ // translate the fixed words of the conjoint table (C1 heading, C2 column labels)
  if(lang()==="en") return html;
  const c1=MS.C1, c2=MS.C2;
  if(c1&&c1.trim()) html=html.replace(/Pair (\d) of (\d)\. Imagine everyone had to leave Cocos and the Government offered these two deals\./, (m,a,b)=>esc(c1.replace("[number]",a)));
  if(c2&&c2.trim()){ const l=c2.split("\n").map(x=>x.trim()).filter(Boolean); if(l.length===2){ html=html.replace(/>Deal A</g,">"+esc(l[0])+"<").replace(/>Deal B</g,">"+esc(l[1])+"<"); } }
  return html;
}
function render(){
  const main=document.getElementById("main"); const cnt=document.getElementById("cnt");
  cnt.textContent = loadResponses().length + " saved";
  document.getElementById("langTag").textContent = lang()==="en" ? "EN" : "CM";
  if(!S){ if(VIEW.screen==="house") renderHouse(main, VIEW.house); else if(VIEW.screen==="grid") renderGrid(main); else if(VIEW.screen==="admin") admin(); else renderHome(main); return; }
  if(S.idx>=S.pages.length){ finish(); return; }
  const page=S.pages[S.idx];
  const items=page.items.filter(visible);
  if(!items.length){ S.idx++; saveCur(); render(); return; }
  if(items.some(i=>i.js==="conjoint") && !S.cj){ S.cj=drawConjoint(); saveCur(); }
  let h=`<h3 class="blk">${esc(page.block)}${S.house?` &middot; house ${esc(S.house)}`:""}</h3>`;
  for(const it of items) h+=renderItem(it);
  main.innerHTML=h; window.scrollTo(0,0);
  document.getElementById("nav").style.display="flex";
  document.getElementById("back").disabled = S.idx===(S.house?1:0);
  bind(items);
}
function renderItem(it){
  const v=S.ans[it.tag]; const k=I18N[it.tag]||{};
  let h=`<div class="q" data-tag="${it.tag}">`;
  if(it.type==="DB"){ let t=it.text; if(/cj\d+_table/.test(it.tag)) t=cjTableText(t); else t=tr(k.text, t); h+=`<div>${pipe(t)}</div></div>`; return h; }
  h+=`<p class="qt">${pipe(itemText(it))}</p>`;
  if(it.ask_note) h+=`<details class="asknote"><summary>${lang()==="en"?"If asked what this means":"Jika ditanya"}</summary><p>${esc(tr(k.ask_note, it.ask_note))}</p></details>`;
  if(it.type==="MC"||it.type==="MCH"||it.type==="MA"){
    const multi=it.type==="MA"; const sel = multi ? (v||[]) : v; const ch=itemChoices(it);
    ch.forEach((c,i)=>{ const kk=i+1; const on = multi ? sel.includes(kk) : sel===kk;
      h+=`<div class="opt ${multi?'multi':''} ${on?'sel':''}" data-k="${kk}"><span class="dot"></span><span>${esc(c)}</span>`;
      if(it.other===kk) h+=`<input type="text" placeholder="please specify" data-other="${it.tag}" value="${esc(S.ans[it.tag+"_TEXT"]||"")}">`;
      h+=`</div>`; });
  } else if(it.type==="TE"||it.type==="TEN"){
    h+=`<input class="te" type="${it.type==="TEN"?"number":"text"}" data-te="${it.tag}" value="${esc(v||"")}">`;
  } else if(it.type==="TEML"){
    h+=`<textarea class="te" data-te="${it.tag}">${esc(v||"")}</textarea>`;
  } else if(it.type==="MATRIX"){
    const m=v||{}; const rows=trList(k.rows, it.rows); const cols=trList(k.cols, it.cols.map(c=>c.replace(/<br>/g," ")));
    h+=`<div class="tblwrap"><table class="mx"><tr><th></th>${cols.map(c=>`<th>${esc(c)}</th>`).join("")}</tr>`;
    rows.forEach((r,ri)=>{ h+=`<tr><td class="rowlab">${esc(r)}</td>`;
      it.cols.forEach((c,ci)=>{ h+=`<td class="cell ${m[ri+1]===ci+1?'sel':''}" data-r="${ri+1}" data-c="${ci+1}">${m[ri+1]===ci+1?'●':''}</td>`; });
      h+=`</tr>`; });
    h+=`</table></div>`;
  }
  return h+`</div>`;
}
function bind(items){
  document.querySelectorAll(".q").forEach(qel=>{
    const tag=qel.dataset.tag; const it=items.find(i=>i.tag===tag); if(!it) return;
    qel.querySelectorAll(".opt").forEach(o=>o.addEventListener("click",e=>{
      if(e.target.tagName==="INPUT") return;
      const k=+o.dataset.k;
      if(it.type==="MA"){ const cur=new Set(S.ans[tag]||[]); cur.has(k)?cur.delete(k):cur.add(k); S.ans[tag]=[...cur].sort((a,b)=>a-b); }
      else S.ans[tag]=k;
      if(tag==="language"){ S.lang = k===2 ? "ms" : "en"; }
      saveCur(); render();
    }));
    qel.querySelectorAll("input[data-other]").forEach(i=>i.addEventListener("input",e=>{S.ans[tag+"_TEXT"]=e.target.value; saveCur();}));
    qel.querySelectorAll("[data-te]").forEach(i=>i.addEventListener("input",e=>{S.ans[tag]=e.target.value; saveCur();}));
    qel.querySelectorAll("td.cell").forEach(c=>c.addEventListener("click",()=>{ const m=S.ans[tag]||{}; m[c.dataset.r]=+c.dataset.c; S.ans[tag]=m; saveCur(); render(); }));
  });
}
document.getElementById("next").addEventListener("click",()=>{
  if(!S) return;
  const page=S.pages[S.idx];
  if(page.items.some(i=>i.tag==="consent") && S.ans.consent===2){ S.declined=true; finish(); return; }
  S.idx++; saveCur(); render();
});
document.getElementById("endEarly").addEventListener("click",()=>{
  if(!S) return;
  if(confirm("End this interview now and save the answers given so far? The record will be marked as incomplete.")){ S.endedEarly=true; finish(); }
});
document.getElementById("back").addEventListener("click",()=>{
  if(!S) return; const floor=S.house?1:0; if(S.idx<=floor) return;
  let i=S.idx-1; while(i>floor && !S.pages[i].items.some(visible)) i--;
  S.idx=i; saveCur(); render();
});
function finish(){
  S.finished=new Date().toISOString();
  const r=loadResponses();
  r.push({id:S.id,started:S.started,finished:S.finished,version:S.version,listArm:S.listArm,house:S.house,lang:S.lang,completed:S.endedEarly?0:1,lastPage:S.idx,cj:S.cj,ans:S.ans}); saveResponses(r);
  const houseId=S.house, early=S.endedEarly, declined=S.declined;
  if(houseId){ const hh=loadHH(); const rec=houseRec(hh,houseId);
    if(declined){ rec.visits.push({date:today(), outcome:"R", note:"declined at consent"}); }
    else { rec.responses.push(S.id); rec.visits.push({date:today(), outcome: early?"P":"I", note:""}); }
    touch(rec); saveHH(hh); }
  localStorage.removeItem(KEY_CUR); S=null;
  syncNow("interview");
  if(localStorage.getItem("cocos_autobackup")!=="off"){ try{ download("cocos_backup_"+new Date().toISOString().replace(/[:.]/g,"-")+"_n"+r.length+".json", JSON.stringify({responses:r, households:loadHH()}), "application/json"); }catch(e){} }
  document.getElementById("nav").style.display="none";
  document.getElementById("main").innerHTML=`<div class="end"><h2>Thank you</h2><p>Your responses have been saved on this device.</p><p class="info">Please hand the tablet back to the interviewer.</p><p style="margin-top:40px"><button id="again">${houseId?"Back to the house list":"Start next respondent"}</button></p></div>`;
  document.getElementById("cnt").textContent=loadResponses().length+" saved";
  document.getElementById("again").addEventListener("click",()=>{ VIEW={screen:"grid"}; render(); });
}

// ---------------- export
function flatten(r){
  const row={response_id:r.id,started:r.started,finished:r.finished,version:r.version,house:r.house||"",language:r.lang||"",completed:r.completed==null?"":r.completed,list_arm:r.listArm||""};
  for(const b of SPEC.blocks) for(const p of b.pages) for(const it of p){
    if(it.type==="DB") continue; const v=r.ans[it.tag];
    if(it.type==="MA"){ it.choices.forEach((c,i)=>row[it.tag+"_"+(i+1)] = v&&v.includes(i+1)?1:0); if(it.other) row[it.tag+"_TEXT"]=r.ans[it.tag+"_TEXT"]||""; }
    else if(it.type==="MATRIX"||it.type==="SLIDER"){ it.rows.forEach((rw,i)=>row[it.tag+"_"+(i+1)] = v&&v[i+1]!=null?v[i+1]:""); }
    else { row[it.tag]= v==null?"":v; if(it.other) row[it.tag+"_TEXT"]=r.ans[it.tag+"_TEXT"]||""; }
  }
  if(r.cj){ row.attr_order=r.cj.attr_order; r.cj.labels.forEach((l,i)=>row["r"+(i+1)+"_label"]=l);
    r.cj.tasks.forEach((t,ti)=>{ row["t"+(ti+1)+"_pick"]=t.pick||""; for(const p of ["A","B"]) t[p].forEach((lv,ri)=>row["t"+(ti+1)+"_"+p+"_r"+(ri+1)]=lv); }); }
  return row;
}
function flattenHH(h){
  const rows=[]; const maxV=Math.max(1,...Object.values(h.houses).map(x=>x.visits.length));
  for(const id of allHouseIds(h)){ const rec=h.houses[id]||houseRec({houses:{},extras:[]},id); const ex=h.extras.find(e=>e.id===id);
    const row={house:id, type: HOUSES_MAIN.includes(id)?"main":HOUSES_SPECIAL.includes(id)?"special":"extra", description: ex?ex.desc:"", status: status(rec), occupied: rec.occupied, adult_men: rec.men, adult_women: rec.women, birthday_rank: rec.rank, knows_respondent_well: rec.knows||"", n_visits: rec.visits.length, response_ids: rec.responses.join(";"), notes: rec.notes};
    for(let i=0;i<maxV;i++){ const v=rec.visits[i]||{}; row["visit"+(i+1)+"_date"]=v.date||""; row["visit"+(i+1)+"_outcome"]=v.outcome||""; row["visit"+(i+1)+"_note"]=v.note||""; }
    rows.push(row); }
  return rows;
}
function toCSV(rows){ if(!rows.length) return ""; const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  const q=v=>{v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return cols.join(",")+"\n"+rows.map(r=>cols.map(c=>q(r[c])).join(",")).join("\n"); }
function download(name,text,type){ const b=new Blob([text],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
function backupName(){ return "cocos_backup_"+new Date().toISOString().slice(0,16).replace(/[:T]/g,"-")+"_"+(settings().interviewer||"device").split(" ")[0]+".json"; }
function backupJSON(){ return JSON.stringify({device:deviceId(), interviewer:settings().interviewer||"", exported:new Date().toISOString(), responses:loadResponses(), households:loadHH()}); }
// Share the backup through the phone or tablet share sheet (Gmail, Drive, etc.). Falls back to a download where sharing files is not supported.
function shareBackup(){
  const name=backupName(), text=backupJSON();
  try{
    const f=new File([text],name,{type:"application/json"});
    const n=loadResponses().length;
    const msg="Cocos survey backup from "+(settings().interviewer||"the tablet")+": "+n+" responses, household log included. Send to "+SYNC.email;
    if(navigator.canShare && navigator.canShare({files:[f]})){ navigator.share({files:[f], title:"Cocos survey backup", text:msg}).then(()=>setSetting("lastShare", new Date().toISOString())).catch(e=>{ if(e && e.name!=="AbortError") download(name,text,"application/json"); }); return; }
  }catch(e){}
  download(name,text,"application/json");
  alert("This browser cannot open the share sheet, so the backup was downloaded instead. Attach it to an email to "+SYNC.email+".");
}

// ---------------- sync with the research team's Google Apps Script (optional; does nothing until SYNC.url is set)
const SYNC = { url: "https://script.google.com/macros/s/AKfycbyV074oj9YVRsvibP_BysQW8bn8lKgSgG2ODsZzs56KdbUTgur_VLDqk_YYbvxPHro/exec", email: "lachlan.mcnamee@monash.edu" };
function passcode(){ return (settings().passcode||"").trim(); }
let syncTimer=null, syncBusy=false;
function syncUrl(){ return SYNC.url || settings().syncUrl || ""; }
function syncEnabled(){ return !!syncUrl() && !!passcode(); }
function mergeHH(a,b){ // union of two household logs; per house the more recently updated record wins its fields, visits and responses are unioned
  const out={houses:{},extras:[]}; const ids=new Set([...a.extras.map(e=>e.id),...b.extras.map(e=>e.id)]);
  for(const id of ids){ out.extras.push(a.extras.find(e=>e.id===id)||b.extras.find(e=>e.id===id)); }
  const keys=new Set([...Object.keys(a.houses),...Object.keys(b.houses)]);
  for(const k of keys){ const x=a.houses[k], y=b.houses[k]; if(!x||!y){ out.houses[k]=x||y; continue; }
    const [newer,older]= (x.updated||"") >= (y.updated||"") ? [x,y] : [y,x];
    const rec=Object.assign({}, older, newer);
    const vkey=v=>v.date+"|"+v.outcome+"|"+(v.note||""); const seen=new Set(); rec.visits=[];
    for(const v of [...(x.visits||[]),...(y.visits||[])]){ if(!seen.has(vkey(v))){ seen.add(vkey(v)); rec.visits.push(v); } }
    rec.visits.sort((p,q)=>(p.date||"").localeCompare(q.date||""));
    rec.responses=[...new Set([...(x.responses||[]),...(y.responses||[])])];
    out.houses[k]=rec; }
  return out;
}
function mergeResponses(a,b){ const m=new Map(); for(const r of [...a,...b]) if(r&&r.id) m.set(r.id,r); return [...m.values()].sort((p,q)=>(p.started||"").localeCompare(q.started||"")); }
function scheduleSync(){ if(!syncEnabled()) return; clearTimeout(syncTimer); syncTimer=setTimeout(()=>syncNow("edit"), 4000); }
async function syncNow(reason){
  if(!syncEnabled()) return false;
  if(!navigator.onLine){ setSetting("syncState","offline"); updateSyncLine(); return false; }
  if(syncBusy) return false; syncBusy=true; setSetting("syncState","busy"); updateSyncLine();
  try{
    const body=JSON.stringify({passcode:passcode(), device:deviceId(), interviewer:settings().interviewer||"", reason, version:SPEC.version, responses:loadResponses(), households:loadHH()});
    const res=await fetch(syncUrl(),{method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body, redirect:"follow"});
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||"server refused");
    if(j.households) saveHH(mergeHH(loadHH(), j.households));
    if(j.responses) saveResponses(mergeResponses(loadResponses(), j.responses));
    setSetting("lastSync", new Date().toISOString()); setSetting("syncState","ok"); setSetting("syncError","");
    syncBusy=false; updateSyncLine(); if(!S && (VIEW.screen==="grid"||VIEW.screen==="home")) render(); return true;
  }catch(e){ setSetting("syncState","error"); setSetting("syncError", String(e&&e.message||e)); syncBusy=false; updateSyncLine(); return false; }
}
function syncLineText(){
  if(!syncEnabled()) return "";
  const st=settings(); const t=st.lastSync? new Date(st.lastSync) : null; const when=t? t.toLocaleString([], {day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "never";
  if(st.syncState==="busy") return "Syncing with the research team…";
  if(st.syncState==="offline") return "Offline. Last synced: "+when+". Will sync when online.";
  if(st.syncState==="error") return "Sync failed ("+(st.syncError||"")+"). Last synced: "+when+".";
  return "Synced with the research team: "+when+".";
}
function updateSyncLine(){ const el=document.getElementById("syncLine"); if(el) el.textContent=syncLineText(); }
window.addEventListener("online", ()=>syncNow("online"));

function admin(){
  const r=loadResponses(); const csv=toCSV(r.map(flatten)); const hh=loadHH(); const hcsv=toCSV(flattenHH(hh)); const d=new Date().toISOString().slice(0,10);
  const done=Object.values(hh.houses).filter(x=>x.responses.length).length; const st=settings(); const showFiles=!!VIEW.files;
  document.getElementById("nav").style.display="none";
  const syncBlock = !syncUrl() ? "" : syncEnabled()
    ? `<button class="homebtn" id="syncBtn"><span class="hb-title">Sync now</span><span class="hb-sub" id="syncLine">${esc(syncLineText())}</span></button>`
    : `<button class="homebtn" id="syncSetup"><span class="hb-title">Set up sync</span><span class="hb-sub">Enter the passcode from Lachlan (one time)</span></button>`;
  document.getElementById("main").innerHTML=`<div class="admin">
  <p style="margin:0 0 10px"><a href="#" id="backHome" style="color:var(--acc)">&larr; Home</a></p>
  <h2>Data and settings</h2><p class="info"><b>${r.length}</b> interview(s) on this device; <b>${done}</b> houses done.</p>
  ${syncBlock}
  <button class="homebtn sec" id="share"><span class="hb-title">Send backup by email</span><span class="hb-sub">${st.lastShare?"Last sent "+esc(new Date(st.lastShare).toLocaleString()):"Opens the share sheet: choose Gmail, send to "+esc(SYNC.email)}</span></button>
  <p style="margin-top:22px"><button class="sec" id="toggleFiles">${showFiles?"Hide files and settings":"Files and settings"}</button></p>
  <div id="files" style="display:${showFiles?"block":"none"}">
    ${syncUrl()?`<div class="sub">Sync passcode</div><p><input type="password" class="te" id="pass" value="${esc(passcode())}" style="max-width:220px;display:inline-block" inputmode="numeric" autocomplete="off" placeholder="6 digits"> <button id="passSave" class="sec">Save</button></p><p class="info">Leave blank to keep this device offline-only.</p>`:""}
    <div class="sub">Files</div>
    <p><button id="dlcsv" class="sec">Download responses CSV</button> <button id="dlhh" class="sec">Download household log CSV</button></p>
    <p><button id="dljson" class="sec">Download everything (JSON backup)</button> <button id="copy" class="sec">Copy responses CSV to clipboard</button></p>
    <p class="info">Downloads go to the tablet's Downloads folder.</p>
    <details><summary class="info">Preview of the responses CSV</summary><pre>${esc(csv).slice(0,3000)}${csv.length>3000?"\n…":""}</pre></details>
    <p><label><input type="checkbox" id="autobk" ${localStorage.getItem("cocos_autobackup")!=="off"?"checked":""}> Save a JSON backup to Downloads after each interview</label></p>
    <p style="margin-top:30px"><button class="sec" id="restore">Restore from a JSON backup file</button> <input type="file" id="restoreFile" accept="application/json" style="display:none"></p>
    <p style="margin-top:30px"><button class="warn" id="wipe">Delete all stored responses and the household log</button> <span class="info">(only after you have confirmed the export)</span></p>
  </div></div>`;
  document.getElementById("backHome").onclick=e=>{e.preventDefault(); VIEW={screen:"home"}; render();};
  document.getElementById("toggleFiles").onclick=()=>{ VIEW={screen:"admin", files:!showFiles}; render(); };
  document.getElementById("dlcsv").onclick=()=>download("cocos_responses_"+d+".csv",csv,"text/csv");
  document.getElementById("dlhh").onclick=()=>download("cocos_household_log_"+d+".csv",hcsv,"text/csv");
  document.getElementById("dljson").onclick=()=>download(backupName(),backupJSON(),"application/json");
  document.getElementById("share").onclick=()=>shareBackup();
  if(syncUrl()){
    document.getElementById("passSave").onclick=async()=>{ setSetting("passcode", document.getElementById("pass").value.trim()); setSetting("syncState",""); if(passcode()){ const ok=await syncNow("passcode"); if(!ok && settings().syncState==="error"){ alert("The research team's server did not accept that passcode: "+settings().syncError); } } VIEW={screen:"admin"}; render(); };
    const su=document.getElementById("syncSetup"); if(su) su.onclick=()=>{ VIEW={screen:"admin", files:true}; render(); setTimeout(()=>{ const p=document.getElementById("pass"); if(p) p.focus(); },50); };
    const sb=document.getElementById("syncBtn"); if(sb) sb.onclick=async()=>{ const ok=await syncNow("manual"); if(ok) render(); };
  }
  document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(csv).then(()=>alert("Copied "+r.length+" responses"))};
  document.getElementById("wipe").onclick=async()=>{ if(prompt("Type DELETE to remove all "+r.length+" responses and the household log from this device")!=="DELETE") return;
    saveResponses([]); saveHH({houses:{},extras:[]});
    if(syncEnabled() && confirm("Also delete the synced copy held by the research team? Choose Cancel to keep it (it will come back to this device at the next sync).")){
      try{ const res=await fetch(syncUrl(),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({passcode:passcode(), device:deviceId(), action:"reset", confirm:"DELETE"})}); const j=await res.json(); alert(j.ok?"Deleted on the server too.":"Server said: "+(j.error||"no")); }catch(e){ alert("Could not reach the server: "+e.message); } }
    render(); };
  document.getElementById("autobk").onchange=e=>localStorage.setItem("cocos_autobackup", e.target.checked?"on":"off");
  document.getElementById("restore").onclick=()=>document.getElementById("restoreFile").click();
  document.getElementById("restoreFile").onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader(); rd.onload=()=>{ try{ const j=JSON.parse(rd.result); const resp=Array.isArray(j)?j:j.responses; if(!confirm("Replace the data on this tablet with the backup ("+(resp||[]).length+" responses)?")) return; if(resp) saveResponses(resp); if(j.households) saveHH(j.households); render(); }catch(err){ alert("Could not read that file."); } }; rd.readAsText(f); };
}
document.getElementById("hdrAdmin").addEventListener("click",e=>{e.preventDefault(); if(!S){ VIEW={screen:"home"}; render(); } else if(confirm("A respondent session is in progress. Leave it and go to the home screen? (Their progress is kept; the interview can be resumed from Home.)")){ saveCur(); S=null; VIEW={screen:"home"}; render(); }});
document.getElementById("langTag").addEventListener("click",e=>{e.preventDefault(); toggleLang();});
try{ const c=localStorage.getItem(KEY_CUR); if(c){ S=JSON.parse(c); } }catch(e){}
render();
if(location.protocol==="https:" && "serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(!S) location.reload(); });
  navigator.serviceWorker.register("sw.js").catch(e=>console.log("sw failed",e));
}
