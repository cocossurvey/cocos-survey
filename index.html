<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cocos pilot survey (offline)</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E6C72">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230E6C72'/%3E%3Ctext x='32' y='42' font-size='30' text-anchor='middle' fill='white' font-family='sans-serif'%3EC%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#F6F8F7;--ink:#182422;--mute:#5E6F6D;--rule:#D5DEDC;--acc:#0E6C72;--acc-soft:#E3F0F0;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:19px;line-height:1.45}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid var(--rule);background:var(--card);font-size:14px;color:var(--mute)}
header b{color:var(--ink)}
main{max-width:820px;margin:0 auto;padding:18px 16px 120px}
.q{margin:0 0 26px}
.qt{font-weight:600;margin:0 0 10px}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:6px 0;border:1px solid var(--rule);border-radius:10px;background:var(--card);cursor:pointer;-webkit-tap-highlight-color:transparent}
.opt.sel{border-color:var(--acc);background:var(--acc-soft)}
.opt .dot{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);flex:none}
.opt.multi .dot{border-radius:5px}
.opt.sel .dot{background:var(--acc);border-color:var(--acc)}
.opt input[type=text]{margin-left:auto;font-size:17px;padding:6px 8px;border:1px solid var(--rule);border-radius:6px;width:45%}
input.te,textarea.te{width:100%;font-size:18px;padding:10px;border:1px solid var(--rule);border-radius:8px;background:var(--card)}
textarea.te{min-height:110px}
table.mx{width:100%;border-collapse:collapse;font-size:16px}
table.mx th,table.mx td{border:1px solid var(--rule);padding:8px 6px;text-align:center;vertical-align:middle;min-width:46px;height:48px}
table.mx th{font-size:14px}
table.mx td.rowlab{text-align:left;font-weight:600;width:30%}
table.mx td.cell{cursor:pointer}
table.mx td.cell.sel{background:var(--acc);color:#fff}
.tblwrap{overflow-x:auto}
.slider{margin:14px 0 22px}
.slider label{display:flex;justify-content:space-between;font-weight:600}
.slider input{width:100%}
table.cj{width:100%;border-collapse:collapse;font-size:16px;margin-bottom:18px}
table.cj th,table.cj td{border:1px solid #999;padding:8px;vertical-align:top;text-align:left}
table.cj th{background:#dde5f0}
table.cj td.lab{background:#f2f2f2;font-weight:600;width:32%}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-between;gap:12px;padding:12px 16px;background:var(--card);border-top:1px solid var(--rule)}
button{font-size:18px;padding:12px 22px;border-radius:10px;border:1px solid var(--acc);background:var(--acc);color:#fff;cursor:pointer}
button.sec{background:var(--card);color:var(--acc)}
button:disabled{opacity:.4}
.info{color:var(--mute);font-size:15px}
.admin{padding:20px 16px;max-width:820px;margin:0 auto}
.admin pre{background:var(--card);border:1px solid var(--rule);padding:10px;overflow:auto;max-height:240px;font-size:12px}
.end{text-align:center;padding:60px 20px}
h3.blk{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--acc);margin:0 0 18px}
</style></head><body>
<header><span id="hdr"><b>Cocos pilot survey</b> · offline</span><span><span id="cnt"></span> · <a href="#" id="hdrAdmin" style="color:var(--acc)">Interviewer</a></span></header>
<main id="main"></main>
<div class="nav" id="nav"><button class="sec" id="back">Back</button><span style="flex:1"></span><button class="sec" id="endEarly" style="border-color:#B05A2A;color:#B05A2A">End early</button><button id="next">Next</button></div>
<script>
const SPEC = {"blocks": [{"name": "Interviewer", "randomizer": null, "pages": [[{"tag": "interviewer", "type": "MC", "text": "Interviewer: who is administering this survey?", "choices": ["Susan Carland", "Lachlan McNamee", "Local research assistant / interpreter", "Self-completed by respondent"]}]]}, {"name": "Introduction and consent", "randomizer": null, "pages": [[{"tag": "intro", "type": "DB", "text": "<h3>Cocos (Keeling) Islands community survey: pilot</h3>\n<p>Thank you for taking part. This survey is run by researchers from Monash University (Dr Susan Carland and Dr Lachlan McNamee). It asks about life on Cocos, your household, your views on climate change and the proposed relocation of the community, and how you feel about governments in the region.</p>\n<p>This is a <strong>pilot</strong>: we are testing whether the questions make sense to people on Cocos before a larger study. There are no right or wrong answers, and you can skip any question you do not want to answer.</p>\n<p>Your answers are confidential. They will not be shared with the Australian Government, the Shire, or anyone outside the research team, and no one will be identified in anything we publish.</p>\n"}], [{"tag": "consent", "type": "MC", "text": "Do you agree to take part in this survey?", "choices": ["Yes, I agree to take part", "No, I do not want to take part"]}]]}, {"name": "About you and your household", "randomizer": null, "pages": [[{"tag": "island", "type": "MC", "text": "Where do you live?", "choices": ["Home Island", "West Island", "Elsewhere (please say where)"], "other": 3}, {"tag": "cocos_malay", "type": "MC", "text": "Are you Cocos Malay?", "choices": ["Yes", "No"]}], [{"tag": "culture_preserve", "type": "MC", "text": "How important is it to you that Cocos Malay culture and traditions are preserved for future generations?", "choices": ["Very important", "Quite important", "Not very important", "Not at all important"], "display_if": ["cocos_malay", 1]}, {"tag": "culture_confident", "type": "MC", "text": "How confident are you that you can maintain Cocos Malay cultural practices?", "choices": ["Very confident", "Somewhat confident", "Not very confident", "Not at all confident"], "display_if": ["cocos_malay", 1]}, {"tag": "religion", "type": "MC", "text": "What is your religion?", "choices": ["Islam", "Christianity", "No religion", "Other"], "other": 4}], [{"tag": "religiosity", "type": "MC", "text": "How often do you attend the mosque or church?", "choices": ["More than once a week", "About once a week", "A few times a month", "A few times a year", "Only on special occasions", "Never"], "display_if_not": ["religion", 3]}, {"tag": "born_cocos", "type": "MC", "text": "Were you born on the Cocos (Keeling) Islands?", "choices": ["Yes", "No, born elsewhere in Australia", "No, born in another country"]}, {"tag": "years_cocos", "type": "TEN", "text": "How many years in total have you lived on Cocos?"}], [{"tag": "age", "type": "TEN", "text": "How old are you?"}, {"tag": "gender", "type": "MC", "text": "What is your gender?", "choices": ["Man", "Woman", "Prefer to self-describe", "Prefer not to say"], "other": 3}, {"tag": "hh_size", "type": "TEN", "text": "How many people live in your household? (Household means you, your spouse and any children under the age of 21.)"}], [{"tag": "hh_relation", "type": "MC", "text": "What is your relationship to the head of your household?", "choices": ["Self", "Spouse", "Child", "Parent", "Other"]}, {"tag": "education", "type": "MC", "text": "What is the highest level of education you have completed?", "choices": ["None", "Primary", "Secondary (Year 10)", "Secondary (Year 12)", "TAFE / trade certificate", "University", "Other"]}, {"tag": "marital", "type": "MC", "text": "What is your marital status?", "choices": ["Single", "Married", "Widowed", "Divorced / separated"]}], [{"tag": "lang_home", "type": "MA", "text": "Which languages do you speak at home? (tick all that apply)", "choices": ["Cocos Malay", "English", "Standard Malay / Bahasa", "Other"], "other": 4}, {"tag": "speak_english", "type": "MC", "text": "How well do you speak English?", "choices": ["Not at all", "Not well (a few words or phrases)", "Moderately well (can hold a basic conversation)", "Very well"]}, {"tag": "read_english", "type": "MC", "text": "How well do you read English?", "choices": ["Not at all", "Not well (a few words or phrases)", "Moderately well (can read basic text)", "Very well"]}]]}, {"name": "Work, income and family connections", "randomizer": null, "pages": [[{"tag": "working", "type": "MC", "text": "Are you currently working?", "choices": ["Yes, permanent", "Yes, contract / casual", "No"]}, {"tag": "sector", "type": "MC", "text": "What is your main type of work?", "choices": ["Shire / local government", "Education (school)", "Health (clinic, nursing)", "Other government services (e.g. Administrator's office, police, customs)", "Cocos Co-operative", "Tourism / hospitality", "Fishing", "Retail", "Construction and maintenance", "Transport, airport or port", "Defence-related work", "Care work", "Other"], "other": 13}, {"tag": "family_mainland", "type": "MA", "text": "Do you have close family (parents, children, siblings) living away from Cocos? (tick all that apply)", "choices": ["Yes, in Perth", "Yes, elsewhere in Western Australia", "Yes, elsewhere in Australia", "Yes, on Christmas Island", "Yes, in Malaysia", "Yes, somewhere else", "No"]}], [{"tag": "remit_receive", "type": "MC", "text": "Do you or your household receive money from family living away from Cocos?", "choices": ["Yes, regularly", "Yes, occasionally", "No"]}, {"tag": "support_family", "type": "MC", "text": "Do you send money to any family members living on the mainland or elsewhere away from Cocos?", "choices": ["Yes, regularly", "Yes, occasionally", "No"]}, {"tag": "centrelink", "type": "MC", "text": "Do you or anyone in your household receive a Centrelink payment? (Household means you, your spouse and any children under the age of 21.)", "choices": ["Yes", "No", "Prefer not to say"]}], [{"tag": "centrelink_type", "type": "MA", "text": "Which payment(s)? (tick all that apply)", "choices": ["Age Pension", "JobSeeker", "Disability Support Pension", "Parenting Payment", "Family Tax Benefit", "Carer Payment", "Other"], "other": 7, "display_if": ["centrelink", 1]}, {"tag": "get_by", "type": "MC", "text": "Thinking about all the money coming into your household, is it enough for you to get by?", "choices": ["Yes, easily", "Yes, just enough", "Not really", "Not at all"]}]]}, {"name": "Moving and mobility", "randomizer": null, "pages": [[{"tag": "time_6m", "type": "MC", "text": "Over the past six months, where have you spent most of your time?", "choices": ["All or almost all of my time on Cocos", "More time on Cocos than on the mainland", "About equal time on Cocos and the mainland", "More time on the mainland than on Cocos", "All or almost all of my time on the mainland", "Mostly in another country"]}, {"tag": "hh_moved_5y", "type": "MC", "text": "In the past five years, has anyone from your household moved away from Cocos to live somewhere else? (Household means you, your spouse and any children under the age of 21.)", "choices": ["Yes", "No"]}, {"tag": "hope_10y", "type": "MC", "text": "Where do you hope your household will be living in 10 years?", "choices": ["Home Island", "West Island", "Perth", "Elsewhere in Western Australia", "Elsewhere in Australia", "Christmas Island", "Malaysia", "Other"], "other": 8}], [{"tag": "expect_10y", "type": "MC", "text": "And where do you think your household will actually be living in 10 years?", "choices": ["Home Island", "West Island", "Perth", "Elsewhere in Western Australia", "Elsewhere in Australia", "Christmas Island", "Malaysia", "Other"], "other": 8}, {"tag": "migr_factors", "type": "MA", "text": "What factors would influence your household's decision to move somewhere else from where you are today? (tick all that apply)", "choices": ["Sea-level rise / flooding / erosion", "Economic opportunity", "Education for children", "Health care", "Family reunion", "Cost of living on Cocos", "Other"], "other": 7}, {"tag": "migr_confidence", "type": "MC", "text": "If your household wanted to move away from Cocos, how confident are you that you could do so? (Household means you, your spouse and any children under the age of 21.)", "choices": ["Very confident", "Somewhat confident", "Not confident", "Not at all confident"]}], [{"tag": "finance_holdback", "type": "MC", "text": "Is your financial situation holding you back from leaving Cocos?", "choices": ["Yes, a lot", "Yes, somewhat", "No", "I do not want to leave anyway"]}, {"tag": "migr_obstacles", "type": "MA", "text": "What obstacles might prevent your household from moving if you wanted to? (tick all that apply)", "choices": ["Lack of money", "Family obligations", "Attachment to Cocos", "No job on the mainland", "Housing costs on the mainland", "Language", "Other"], "other": 7}]]}, {"name": "Climate change and adaptation", "randomizer": null, "pages": [[{"tag": "cc_belief", "type": "MC", "text": "Do you believe that climate change is happening?", "choices": ["Yes, definitely", "Yes, probably", "No, probably not", "No, definitely not"]}, {"tag": "cc_serious", "type": "MC", "text": "Do you think that climate change is a very serious problem, somewhat serious, not very serious, or not a problem at all for you?", "choices": ["Very serious problem", "Somewhat serious", "Not very serious", "Not a problem at all"]}, {"tag": "cc_meetings", "type": "MC", "text": "How often have you participated in any community meetings or initiatives to address climate change in the past 12 months?", "choices": ["Regularly", "Occasionally", "Rarely", "Never"]}], [{"tag": "cc_discuss", "type": "MC", "text": "How often have you discussed climate change with friends and family members in the past 12 months?", "choices": ["Regularly", "Occasionally", "Rarely", "Never"]}, {"tag": "cc_priority", "type": "MC", "text": "If you had to choose, what should be the top priority for the Australian Government in addressing climate change on Cocos?", "choices": ["Protecting Cocos from climate change (e.g. seawalls, raising land, protecting fresh water)", "Reducing pollution and emissions worldwide", "Supporting Cocos residents to relocate to the mainland"]}, {"tag": "cc_efficacy", "type": "MC", "text": "Do you agree or disagree: there is nothing I can do personally to reduce the impact of climate change?", "choices": ["Strongly agree", "Agree", "Disagree", "Strongly disagree"]}], [{"tag": "cc_events", "type": "MA", "text": "In the past 12 months, has your household experienced any of the following? (tick all that apply) (Household means you, your spouse and any children under the age of 21.)", "choices": ["Flooding of your home or yard from the sea (e.g. king tides)", "Storm surge or big swell damage", "Erosion of land near your home", "Salt water getting into wells or gardens", "Shortage of fresh water", "Cyclone or severe storm damage", "Unusual heat", "None of these"]}, {"tag": "cc_flood_freq", "type": "MC", "text": "How often does sea water flood the land around your home?", "choices": ["Never", "Once a year or less", "A few times a year", "Most months", "Most weeks"]}, {"tag": "cc_access", "type": "MA", "text": "In the past 12 months, have weather conditions affected your household's ability to access any of the following? (tick all that apply)", "choices": ["Fresh water", "Food", "The health clinic", "Schooling", "Flights or the ferry", "Work", "None of the above"]}], [{"tag": "cc_adapt", "type": "MA", "text": "Has your household taken any steps to adapt or prepare for rising sea levels in the past 12 months? (tick all that apply)", "choices": ["Built or strengthened a seawall", "Installed a water tank", "Raised the floor of the house", "Moved to higher ground", "Planted trees or vegetation to hold the shoreline", "Other", "None"], "other": 6}, {"tag": "cc_safer", "type": "MC", "text": "If your household wanted to make your home safer from flooding, do you think you would be able to do so?", "choices": ["Yes, easily", "Yes, but it would be hard", "No, probably not", "Definitely not"]}]]}, {"name": "The proposed relocation", "randomizer": null, "pages": [[{"tag": "reloc_intro", "type": "DB", "text": "<p>The next questions are about the Australian Government's proposal, sometimes called a \"managed retreat\", to move the Cocos community away from the islands over coming decades because of rising seas.</p>"}, {"tag": "reloc_heard", "type": "MC", "text": "Before today, how much had you heard about this proposal?", "choices": ["A lot", "Some", "A little", "Nothing at all"]}, {"tag": "reloc_source", "type": "MA", "text": "Where have you heard about it? (tick all that apply)", "choices": ["Shire of Cocos (Keeling) Islands", "The Administrator or Australian Government officials", "Community or mosque meetings", "Family and friends", "News media (TV, radio, newspapers)", "Social media", "Other", "I have not heard about it"], "other": 7}], [{"tag": "uninhabitable", "type": "MC", "text": "Do you agree or disagree: Cocos will become uninhabitable because of rising sea levels this century?", "choices": ["Strongly agree", "Agree", "Disagree", "Strongly disagree"]}, {"tag": "reloc_likely", "type": "MC", "text": "How likely do you think it is that the community will actually be required by the Government to leave Cocos?", "choices": ["Very likely", "Somewhat likely", "Not very likely", "Not at all likely"]}, {"tag": "reloc_when", "type": "MC", "text": "If it does happen, when do you expect the community would be required to leave?", "choices": ["Within the next 5 years", "In 5 to 10 years", "In 10 to 20 years", "More than 20 years from now", "Don't think it will happen"]}], [{"tag": "reloc_support", "type": "MC", "text": "Overall, do you support or oppose the proposal to relocate the Cocos community?", "choices": ["Strongly support", "Somewhat support", "Neither support nor oppose", "Somewhat oppose", "Strongly oppose"]}, {"tag": "reloc_reason", "type": "MC", "text": "In your view, what is the main reason the Australian Government wants to relocate the community?", "choices": ["Rising seas and climate change", "Defence and the airstrip", "The cost of providing services to Cocos", "Something else"], "other": 4}, {"tag": "excuse_direct", "type": "MC", "text": "Do you agree with this statement: the Government is using climate change as an excuse to move the community off Cocos?", "choices": ["Yes, I agree", "No, I do not agree"]}], [{"tag": "reloc_say", "type": "MC", "text": "How much say should the Cocos community have over whether and how relocation happens?", "choices": ["The community should have the final say", "The community and the Government should decide together", "The community should be consulted, but the Government decides", "It is for the Government to decide"]}], [{"tag": "trust", "type": "MATRIX", "text": "How much do you trust each of the following to act in the best interests of the Cocos community?", "rows": ["The Australian Government", "The Administrator of the Indian Ocean Territories", "The Shire of Cocos (Keeling) Islands", "Community and religious leaders on Cocos"], "cols": ["A great deal", "Somewhat", "Not very much", "Not at all"]}], [{"tag": "reloc_self", "type": "MC", "text": "If the Government required your household to leave Cocos, what do you think you would do?", "choices": ["Move willingly", "Move, but reluctantly", "Try to stay for as long as possible", "Refuse to leave"]}, {"tag": "reloc_dest", "type": "MC", "text": "If you had to leave Cocos, where would you go?", "choices": ["Perth", "Elsewhere in Australia", "Christmas Island", "Malaysia", "Somewhere else"], "other": 5}, {"tag": "voice", "type": "MA", "text": "In the past 12 months, have you done any of the following about the relocation proposal? (tick all that apply)", "choices": ["Attended a community meeting", "Signed a petition", "Contacted a Shire councillor, the Administrator or a federal MP", "Posted about it on social media", "Spoken to a journalist", "Taken part in a protest or demonstration", "None of these"]}], [{"tag": "status_future", "type": "MC", "text": "Thinking about the long run, what should Cocos' relationship with Australia be?", "choices": ["Stay as it is now, an external territory of Australia", "More self-government for Cocos within Australia", "Full independence"]}, {"tag": "reloc_worry", "type": "TEML", "text": "What concerns you most about the proposal?"}]]}, {"name": "List experiment: control", "randomizer": "list", "pages": [[{"tag": "list_control", "type": "MC", "text": "<p>Here is a list of statements. Please tell us <strong>how many</strong> of them you agree with. We do not want to know which ones, just the number.</p><ul><li>I trust the Shire council to represent my interests</li><li>Climate change is making life on Cocos harder</li><li>The ferry between Home Island and West Island should run less often</li><li>Young people should be encouraged to study on the mainland</li></ul>", "choices": ["0", "1", "2", "3", "4"]}]]}, {"name": "List experiment: treatment", "randomizer": "list", "pages": [[{"tag": "list_treatment", "type": "MC", "text": "<p>Here is a list of statements. Please tell us <strong>how many</strong> of them you agree with. We do not want to know which ones, just the number.</p><ul><li>I trust the Shire council to represent my interests</li><li>Climate change is making life on Cocos harder</li><li>The ferry between Home Island and West Island should run less often</li><li>Young people should be encouraged to study on the mainland</li><li>The Government is using climate change as an excuse to move the community off Cocos</li></ul>", "choices": ["0", "1", "2", "3", "4", "5"]}]]}, {"name": "Wellbeing", "randomizer": null, "pages": [[{"tag": "health", "type": "MC", "text": "How would you rate your general health?", "choices": ["Very good", "Good", "Fair", "Poor"]}, {"tag": "lifesat", "type": "MC", "text": "How satisfied are you with your life as a whole these days?", "choices": ["Very satisfied", "Satisfied", "Dissatisfied", "Very dissatisfied"]}], [{"tag": "gad2", "type": "MATRIX", "text": "Over the last two weeks, how often have you been bothered by the following problems?", "rows": ["Feeling nervous, anxious or on edge", "Not being able to stop or control worrying"], "cols": ["Not at all", "Several days", "More than half the days", "Nearly every day"]}], [{"tag": "climate_anx", "type": "MATRIX", "text": "Over the last two weeks, how often have you experienced the following when thinking about climate change?", "rows": ["Feeling nervous, anxious or on edge", "Feeling like nothing you do will make a difference", "Difficulty sleeping because of it", "Thinking about it made it hard to concentrate on other things"], "cols": ["Not at all", "Several days", "More than half the days", "Nearly every day"]}]]}, {"name": "Government and the region", "randomizer": null, "pages": [[{"tag": "dem_important", "type": "MC", "text": "How important do you think it is that you live in a country that is a democracy, with leaders chosen by the people?", "choices": ["Very important", "Quite important", "Not very important", "Not at all important"]}, {"tag": "dem_sat_aus", "type": "MC", "text": "How satisfied are you with the way democracy is working today in Australia?", "choices": ["Very satisfied", "Somewhat satisfied", "Not very satisfied", "Not at all satisfied"]}, {"tag": "gov_sat_cocos", "type": "MC", "text": "How satisfied are you with the way Cocos is governed today?", "choices": ["Very satisfied", "Somewhat satisfied", "Not very satisfied", "Not at all satisfied"]}], [{"tag": "fair_treat", "type": "MC", "text": "Do you agree or disagree: the Australian Government treats Cocos residents the same as other Australians?", "choices": ["Strongly agree", "Agree", "Disagree", "Strongly disagree"]}], [{"tag": "thermo", "type": "SLIDER", "text": "Now we would like to ask how you feel about some governments and countries. You can give any number from 0 to 100. Numbers above 50 mean you feel favourable and warm toward it. Numbers below 50 mean you feel unfavourable and cool toward it. If you feel neither warm nor cool, give the number 50.", "rows": ["Malaysia", "Indonesia", "China", "United States", "Australia"]}]]}, {"name": "Identity and culture", "randomizer": null, "pages": [[{"tag": "home", "type": "MC", "text": "How strongly do you feel that Cocos is your home?", "choices": ["Very strongly", "Somewhat", "Not very strongly", "Not at all"]}]]}, {"name": "Relocation packages (conjoint)", "randomizer": null, "pages": [[{"tag": "cj_intro", "type": "DB", "text": "<h3>Choosing between relocation packages</h3>\n<p>We are now going to show you <strong>four pairs</strong> of possible relocation packages. Each package describes one way the Government might move the Cocos community. The packages are made up at random, so some combinations may seem unlikely. That is fine: we just want to know which features matter most to you.</p>\n<p>For each pair, please tell us which of the two packages you would prefer, and then how acceptable each one would be to you compared with staying on Cocos.</p>\n<p>There are no right or wrong answers.</p>", "js": "conjoint"}], [{"tag": "cj1_table", "type": "DB", "text": "<p><strong>Choice 1 of 4.</strong> Imagine the Government offered the community these two relocation packages.</p><table style=\"border-collapse:collapse;width:100%;font-size:1em\"><tr><th style=\"border:1px solid #999;padding:6px\"></th><th style=\"border:1px solid #999;padding:6px;background:#dde5f0\">Package A</th><th style=\"border:1px solid #999;padding:6px;background:#dde5f0\">Package B</th></tr><tr><td style=\"border:1px solid #999;padding:6px;background:#f2f2f2;font-weight:bold;width:34%\">${e://Field/r1_label}</td><td style=\"border:1px solid #999;padding:6px\">${e://Field/t1_ const KEY_RESP = "cocos_responses_v1", KEY_CUR = "cocos_current_v1";
let S = null; // current session state

function loadResponses(){ try{return JSON.parse(localStorage.getItem(KEY_RESP)||"[]")}catch(e){return []} }
function saveResponses(r){ localStorage.setItem(KEY_RESP, JSON.stringify(r)) }
function saveCur(){ localStorage.setItem(KEY_CUR, JSON.stringify(S)) }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8) }

// ---- build the flat page list for a session (randomiser resolved at start)
function buildPages(){
  const pages=[]; const randGroup = SPEC.blocks.filter(b=>b.randomizer);
  const pick = randGroup.length ? randGroup[Math.floor(Math.random()*randGroup.length)].name : null;
  for(const b of SPEC.blocks){
    if(b.randomizer && b.name!==pick) continue;
    for(const p of b.pages) pages.push({block:b.name, items:p});
  }
  return {pages, listArm: pick};
}
function newSession(){
  const bp = buildPages();
  S = {id: uid(), started: new Date().toISOString(), version: SPEC.version, listArm: bp.listArm,
       pages: bp.pages, idx: 0, ans: {}, cj: null};
  saveCur(); render();
}
// ---- conjoint draw (mirrors the Qualtrics JavaScript)
function drawConjoint(){
  const attrs = SPEC.attrs.slice(); const order = attrs.map((_,i)=>i);
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [order[i],order[j]]=[order[j],order[i]];}
  const cj = {attr_order: order.map(i=>attrs[i].key).join("|"), labels: order.map(i=>attrs[i].name), tasks: []};
  for(let t=0;t<SPEC.n_tasks;t++){
    const task={A:[],B:[]};
    for(const p of ["A","B"]) for(const i of order){ const a=attrs[i]; task[p].push(a.levels[Math.floor(Math.random()*a.levels.length)]); }
    cj.tasks.push(task);
  }
  return cj;
}
// ---- display logic
function visible(it){
  if(it.display_if){ const [t,c]=it.display_if; return S.ans[t]===c; }
  if(it.display_if_not){ const [t,c]=it.display_if_not; return S.ans[t]!==c; }
  return true;
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function pipe(html){ // replace ${e://Field/...} with conjoint values
  return html.replace(/\$\{e:\/\/Field\/([^}]+)\}/g,(m,f)=>{
    if(!S.cj) return "";
    let mm=f.match(/^r(\d)_label$/); if(mm) return esc(S.cj.labels[+mm[1]-1]);
    mm=f.match(/^t(\d)_([AB])_r(\d)$/); if(mm) return esc(S.cj.tasks[+mm[1]-1][mm[2]][+mm[3]-1]);
    return "";
  });
}
// ---- render
function render(){
  const main=document.getElementById("main"); const cnt=document.getElementById("cnt");
  cnt.textContent = loadResponses().length + " saved";
  if(!S){ renderStart(main); return; }
  if(S.idx>=S.pages.length){ finish(); return; }
  const page=S.pages[S.idx];
  const items=page.items.filter(visible);
  if(!items.length){ S.idx++; saveCur(); render(); return; }
  if(items.some(i=>i.js==="conjoint") && !S.cj){ S.cj=drawConjoint(); saveCur(); }
  let h=`<h3 class="blk">${esc(page.block)}</h3>`;
  for(const it of items) h+=renderItem(it);
  main.innerHTML=h; window.scrollTo(0,0);
  document.getElementById("nav").style.display="flex";
  document.getElementById("back").disabled = S.idx===0;
  bind(items);
}
function renderItem(it){
  const v=S.ans[it.tag];
  let h=`<div class="q" data-tag="${it.tag}">`;
  if(it.type==="DB"){ h+=`<div>${pipe(it.text)}</div></div>`; return h; }
  h+=`<p class="qt">${pipe(it.text)}</p>`;
  if(it.type==="MC"||it.type==="MCH"||it.type==="MA"){
    const multi=it.type==="MA"; const sel = multi ? (v||[]) : v;
    it.choices.forEach((c,i)=>{ const k=i+1; const on = multi ? sel.includes(k) : sel===k;
      h+=`<div class="opt ${multi?'multi':''} ${on?'sel':''}" data-k="${k}"><span class="dot"></span><span>${esc(c)}</span>`;
      if(it.other===k) h+=`<input type="text" placeholder="please specify" data-other="${it.tag}" value="${esc(S.ans[it.tag+"_TEXT"]||"")}">`;
      h+=`</div>`; });
  } else if(it.type==="TE"||it.type==="TEN"){
    h+=`<input class="te" type="${it.type==="TEN"?"number":"text"}" data-te="${it.tag}" value="${esc(v||"")}">`;
  } else if(it.type==="TEML"){
    h+=`<textarea class="te" data-te="${it.tag}">${esc(v||"")}</textarea>`;
  } else if(it.type==="MATRIX"){
    const m=v||{};
    h+=`<div class="tblwrap"><table class="mx"><tr><th></th>${it.cols.map(c=>`<th>${c}</th>`).join("")}</tr>`;
    it.rows.forEach((r,ri)=>{ h+=`<tr><td class="rowlab">${esc(r)}</td>`;
      it.cols.forEach((c,ci)=>{ h+=`<td class="cell ${m[ri+1]===ci+1?'sel':''}" data-r="${ri+1}" data-c="${ci+1}">${m[ri+1]===ci+1?'●':''}</td>`; });
      h+=`</tr>`; });
    h+=`</table></div>`;
  } else if(it.type==="SLIDER"){
    const m=v||{};
    it.rows.forEach((r,ri)=>{ const val=m[ri+1]; h+=`<div class="slider"><label><span>${esc(r)}</span><span id="sv_${it.tag}_${ri+1}">${val==null?"–":val}</span></label><input type="range" min="0" max="100" value="${val==null?50:val}" data-sl="${ri+1}" data-set="${val==null?0:1}"><div class="info" style="display:flex;justify-content:space-between"><span>0 cold</span><span>50</span><span>100 warm</span></div></div>`; });
  }
  return h+`</div>`;
}
function bind(items){

    qel.querySelectorAll("input[data-other]").forEach(i=>i.addEventListener("input",e=>{S.ans[tag+"_TEXT"]=e.target.value; saveCur();}));
    qel.querySelectorAll("[data-te]").forEach(i=>i.addEventListener("input",e=>{S.ans[tag]=e.target.value; saveCur();}));
    qel.querySelectorAll("td.cell").forEach(c=>c.addEventListener("click",()=>{ const m=S.ans[tag]||{}; m[c.dataset.r]=+c.dataset.c; S.ans[tag]=m; saveCur(); render(); }));
    qel.querySelectorAll("input[data-sl]").forEach(s=>s.addEventListener("input",e=>{ const m=S.ans[tag]||{}; m[s.dataset.sl]=+e.target.value; S.ans[tag]=m; document.getElementById("sv_"+tag+"_"+s.dataset.sl).textContent=e.target.value; saveCur(); }));
  });
}
document.getElementById("next").addEventListener("click",()=>{
  if(!S) return;
  // consent decline ends survey
  const page=S.pages[S.idx];
  if(page.items.some(i=>i.tag==="consent") && S.ans.consent===2){ finish(); return; }
  S.idx++; saveCur(); render();
});
document.getElementById("endEarly").addEventListener("click",()=>{
  if(!S) return;
  if(confirm("End this interview now and save the answers given so far? The record will be marked as incomplete.")){ S.endedEarly=true; finish(); }
});
document.getElementById("back").addEventListener("click",()=>{
  if(!S||S.idx===0) return;
  let i=S.idx-1; while(i>0 && !S.pages[i].items.some(visible)) i--;
  S.idx=i; saveCur(); render();
});
function finish(){
  S.finished=new Date().toISOString();
  const r=loadResponses(); r.push({id:S.id,started:S.started,finished:S.finished,version:S.version,listArm:S.listArm,completed:S.endedEarly?0:1,lastPage:S.idx,cj:S.cj,ans:S.ans}); saveResponses(r);
  localStorage.removeItem(KEY_CUR); S=null;
  if(localStorage.getItem("cocos_autobackup")!=="off"){ try{ download("cocos_backup_"+new Date().toISOString().replace(/[:.]/g,"-")+"_n"+r.length+".json", JSON.stringify(r), "application/json"); }catch(e){} }
  document.getElementById("nav").style.display="none";
  document.getElementById("main").innerHTML=`<div class="end"><h2>Thank you</h2><p>Your responses have been saved on this device.</p><p class="info">Please hand the tablet back to the interviewer.</p><p style="margin-top:40px"><button id="again">Start next respondent</button></p></div>`;
  document.getElementById("cnt").textContent=loadResponses().length+" saved";
  document.getElementById("again").addEventListener("click",newSession);
}
function renderStart(main){
  document.getElementById("nav").style.display="none";
  main.innerHTML=`<div class="end"><h2>Cocos pilot survey</h2><p class="info">Offline version ${esc(SPEC.version)}. Responses are stored on this tablet until exported.</p>
  <p style="margin-top:30px"><button id="start">Start new respondent</button></p>
  <p style="margin-top:50px"><button class="sec" id="adminBtn">Interviewer: export / admin</button></p></div>`;
  document.getElementById("start").addEventListener("click",newSession);
  document.getElementById("adminBtn").addEventListener("click",admin);
}
// ---- export
function flatten(r){
  const row={response_id:r.id,started:r.started,finished:r.finished,version:r.version,completed:r.completed==null?"":r.completed,list_arm:r.listArm||""};
  for(const b of SPEC.blocks) for(const p of b.pages) for(const it of p){
    if(it.type==="DB") continue; const v=r.ans[it.tag];
    if(it.type==="MA"){ it.choices.forEach((c,i)=>row[it.tag+"_"+(i+1)] = v&&v.includes(i+1)?1:0); if(it.other) row[it.tag+"_TEXT"]=r.ans[it.tag+"_TEXT"]||""; }
    else if(it.type==="MATRIX"||it.type==="SLIDER"){ it.rows.forEach((rw,i)=>row[it.tag+"_"+(i+1)] = v&&v[i+1]!=null?v[i+1]:""); }
    else { row[it.tag]= v==null?"":v; if(it.other) row[it.tag+"_TEXT"]=r.ans[it.tag+"_TEXT"]||""; }
  }
  if(r.cj){ row.attr_order=r.cj.attr_order; r.cj.labels.forEach((l,i)=>row["r"+(i+1)+"_label"]=l);
    r.cj.tasks.forEach((t,ti)=>{ for(const p of ["A","B"]) t[p].forEach((lv,ri)=>row["t"+(ti+1)+"_"+p+"_r"+(ri+1)]=lv); }); }
  return row;
}
function toCSV(rows){ if(!rows.length) return ""; const cols=[...new Set(rows.flatMap(r=>Object.keys(r)))];
  const q=v=>{v=String(v==null?"":v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return cols.join(",")+"\n"+rows.map(r=>cols.map(c=>q(r[c])).join(",")).join("\n"); }
function download(name,text,type){ const b=new Blob([text],{type}); const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
function admin(){
  const r=loadResponses(); const csv=toCSV(r.map(flatten));
  document.getElementById("nav").style.display="none";
  document.getElementById("main").innerHTML=`<div class="admin"><h2>Interviewer</h2><p><b>${r.length}</b> stored response(s) (complete and ended early) on this device.</p>
  <p><button id="dlcsv">Download CSV</button> <button id="dljson" class="sec">Download JSON</button> <button id="copy" class="sec">Copy CSV to clipboard</button></p>
  <p class="info">Downloads go to the tablet's Downloads folder; email them to yourself when online. Copy works for pasting into an email.</p>
  <pre>${esc(csv).slice(0,4000)}${csv.length>4000?"\n…":""}</pre>
  <p><label><input type="checkbox" id="autobk" ${localStorage.getItem("cocos_autobackup")!=="off"?"checked":""}> Save a JSON backup of all responses to Downloads after each completed interview</label></p>
  <p style="margin-top:30px"><button class="sec" id="wipe">Delete all stored responses</button> <span class="info">(only after you have confirmed the export)</span></p>
  <p style="margin-top:30px"><button class="sec" id="home">Back to start</button></p></div>`;
  document.getElementById("dlcsv").onclick=()=>download("cocos_pilot_responses_"+new Date().toISOString().slice(0,10)+".csv",csv,"text/csv");
  document.getElementById("dljson").onclick=()=>download("cocos_pilot_responses.json",JSON.stringify(r,null,1),"application/json");
  document.getElementById("copy").onclick=()=>{navigator.clipboard.writeText(csv).then(()=>alert("Copied "+r.length+" responses"))};
  document.getElementById("wipe").onclick=()=>{ if(prompt("Type DELETE to remove all "+r.length+" responses from this device")==="DELETE"){ saveResponses([]); admin(); } };
  document.getElementById("home").onclick=()=>{render();};
  document.getElementById("autobk").onchange=e=>localStorage.setItem("cocos_autobackup", e.target.checked?"on":"off");
}
document.getElementById("hdrAdmin").addEventListener("click",e=>{e.preventDefault(); if(!S || confirm("A respondent session is in progress. Open the interviewer screen anyway? (Their progress is kept.)")) admin();});
// ---- resume an interrupted session
try{ const c=localStorage.getItem(KEY_CUR); if(c){ S=JSON.parse(c); } }catch(e){}
render();

if(location.protocol==="https:" && "serviceWorker" in navigator){
  navigator.serviceWorker.addEventListener("controllerchange",()=>{ if(!S) location.reload(); });
  navigator.serviceWorker.register("sw.js").then(r=>{ const h=document.getElementById("hdr"); if(h) h.title="offline copy installed"; }).catch(e=>console.log("sw failed",e));
}
</script></body></html>
